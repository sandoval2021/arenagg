name: QA Hotfix PWA Chat Security CI

on:
  push:
    branches: [qa-hotfix-pwa-chat-security]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api

      - name: Build web
        env:
          VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
        run: npm run build --workspace=@chavea/web

      - name: Assert chat safety and persistent session guards
        run: |
          grep -F "CHAT_SAFETY_BLOCKED" apps/api/src/routes/competition-chat.routes.ts
          grep -F "CHAT_SAFETY_BLOCKED" apps/api/src/routes/casual-room-chat.routes.ts
          grep -F "sameSite: 'Lax'" apps/api/src/routes/auth.routes.ts
          grep -F "hideNotificationCard" apps/web/src/components/push/PushNotificationsCard.tsx
          grep -F 'await tx.$executeRaw`SELECT pg_advisory_xact_lock' apps/api/src/routes/matchmaking-unranked.routes.ts
