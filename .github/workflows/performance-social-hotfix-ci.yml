name: Performance Social Hotfix CI

on:
  push:
    branches: [hotfix-performance-social]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix-performance-social
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply product hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  if new in text:
                      return
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'unexpected count in {path}: {found} != {count}')
              p.write_text(text.replace(old, new))

          # 1) Friendship: fix PostgreSQL void advisory lock + explicit error handling.
          f = 'apps/api/src/routes/friends.routes.ts'
          replace(f,
              "const friendRequestSchema = z.object({ friendId: z.string().uuid() });\n",
              "const friendRequestSchema = z.object({ friendId: z.string().uuid() });\n\ntype FriendRequestResult = {\n  state: 'ACCEPTED' | 'PENDING';\n  friendship: { id: string };\n};\n")
          replace(f,
              "  const [left, right] = orderedPair(user.id, parsed.data.friendId);\n  const result = await db.$transaction(async (tx) => {\n    await tx.$queryRaw`SELECT pg_advisory_xact_lock(hashtext(${`friend:${left}:${right}`}))`;",
              "  const [left, right] = orderedPair(user.id, parsed.data.friendId);\n  const requestId = crypto.randomUUID();\n  let result: FriendRequestResult;\n  try {\n    result = await db.$transaction(async (tx) => {\n      await tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtext(${`friend:${left}:${right}`}))`;",
              1)
          replace(f,
              "    const friendship = await tx.friendship.create({ data: { requesterId: user.id, addresseeId: parsed.data.friendId } });\n    return { state: 'PENDING' as const, friendship };\n  });\n\n  if (result.state === 'ACCEPTED') {",
              "      const friendship = await tx.friendship.create({ data: { requesterId: user.id, addresseeId: parsed.data.friendId } });\n      return { state: 'PENDING' as const, friendship };\n    }, { maxWait: 5_000, timeout: 10_000 });\n  } catch (error) {\n    const prismaCode = typeof error === 'object' && error !== null && 'code' in error\n      ? String((error as { code?: unknown }).code ?? '')\n      : '';\n    console.error('[friends.request] failed', {\n      requestId,\n      requesterId: user.id,\n      friendId: parsed.data.friendId,\n      prismaCode: prismaCode || undefined,\n      message: error instanceof Error ? error.message : String(error),\n    });\n    if (prismaCode === 'P2002') {\n      return c.json({\n        error: 'FRIEND_REQUEST_CONFLICT',\n        message: 'Este convite já existe ou acabou de ser processado.',\n        requestId,\n      }, 409);\n    }\n    return c.json({\n      error: 'FRIEND_REQUEST_FAILED',\n      message: 'Não foi possível enviar o convite agora. Tente novamente.',\n      requestId,\n    }, 500);\n  }\n\n  if (result.state === 'ACCEPTED') {",
              1)

          # 2) Public profile: remove gamification reconciliation from hot read path.
          p = 'apps/api/src/routes/profile.routes.ts'
          replace(p,
              "  await reconcileRareAchievements(db, userId);\n  const target = await db.user.findFirst({",
              "  const target = await db.user.findFirst({",
              1)

          # 3) Standalone standings polling: 12s, cached, foreground only.
          s = 'apps/web/src/pages/competitions/StandingsPage.tsx'
          replace(s,
              "    enabled: Boolean(competitionId),\n    refetchInterval: 3_000,\n    refetchIntervalInBackground: true,",
              "    enabled: Boolean(competitionId),\n    staleTime: 8_000,\n    refetchInterval: 12_000,\n    refetchIntervalInBackground: false,",
              2)
          replace(s, 'Atualiza automaticamente a cada 3 segundos', 'Atualiza automaticamente a cada 12 segundos', 1)

          # 4) Main competition screen: no 3s storm and no hidden-tab stats polling.
          c = 'apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx'
          replace(c,
              "    enabled: Boolean(competitionId),\n    refetchInterval: 3_000,\n    refetchIntervalInBackground: true,",
              "    enabled: Boolean(competitionId),\n    staleTime: 8_000,\n    refetchInterval: 12_000,\n    refetchIntervalInBackground: false,",
              1)
          replace(c, '    staleTime: 1_000,\n    refetchInterval: 3_000,\n    refetchIntervalInBackground: true,', '    staleTime: 8_000,\n    refetchInterval: 12_000,\n    refetchIntervalInBackground: false,', 1)
          replace(c,
              "    enabled: Boolean(competitionId) && Boolean(isStarted),\n    refetchInterval: 3_000,\n    refetchIntervalInBackground: true,",
              "    enabled: Boolean(competitionId) && Boolean(isStarted) && activeTab === 'rounds',\n    staleTime: 8_000,\n    refetchInterval: 12_000,\n    refetchIntervalInBackground: false,",
              1)

          # 5) Public card: robust image fallback + user-visible friendship toast.
          u = 'apps/web/src/pages/PublicProfilePage.tsx'
          replace(u,
              "import { useMutation, useQuery, useQueryClient } from '@tanstack/react-query';",
              "import { useState } from 'react';\nimport { useMutation, useQuery, useQueryClient } from '@tanstack/react-query';",
              1)
          replace(u,
              "  const auth = useAuth();\n  const queryClient = useQueryClient();",
              "  const auth = useAuth();\n  const queryClient = useQueryClient();\n  const [friendToast, setFriendToast] = useState<{ tone: 'success' | 'error'; message: string } | null>(null);\n\n  function showFriendToast(tone: 'success' | 'error', message: string) {\n    setFriendToast({ tone, message });\n    window.setTimeout(() => setFriendToast(null), 3_200);\n  }",
              1)
          replace(u,
              "    onSuccess: async () => {\n      await Promise.all([",
              "    onSuccess: async (result) => {\n      showFriendToast('success', result.status === 'ACCEPTED' ? 'Vocês já são amigos!' : 'Convite enviado!');\n      await Promise.all([",
              1)
          replace(u,
              "      ]);\n    },\n  });",
              "      ]);\n    },\n    onError: (error) => showFriendToast('error', friendError(error)),\n  });",
              1)
          replace(u,
              "    <div className=\"min-h-dvh bg-white text-slate-900\">\n      <main",
              "    <div className=\"min-h-dvh bg-white text-slate-900\">\n      {friendToast && <div role=\"status\" aria-live=\"polite\" className={`fixed left-1/2 top-[max(1rem,env(safe-area-inset-top))] z-[140] w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 rounded-2xl border px-4 py-3 text-center text-sm font-black shadow-2xl ${friendToast.tone === 'success' ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-red-200 bg-red-50 text-red-700'}`}>{friendToast.message}</div>}\n      <main",
              1)
          replace(u,
              "              <div className=\"grid h-20 w-20 place-items-center overflow-hidden rounded-[1.4rem] border border-blue-200 bg-white shadow-md sm:h-24 sm:w-24 sm:rounded-[1.6rem]\">\n                {data.avatarUrl ? <img src={data.avatarUrl} alt=\"\" className=\"h-full w-full object-cover\" /> : <UserRound className=\"h-10 w-10 text-[#073B8C] sm:h-11 sm:w-11\" />}\n              </div>",
              "              <div className=\"relative grid h-20 w-20 place-items-center overflow-hidden rounded-[1.4rem] border border-blue-200 bg-white shadow-md sm:h-24 sm:w-24 sm:rounded-[1.6rem]\">\n                <UserRound className=\"h-10 w-10 text-[#073B8C] sm:h-11 sm:w-11\" />\n                {data.avatarUrl && <img src={data.avatarUrl} alt={playerName} className=\"absolute inset-0 h-full w-full object-cover\" loading=\"eager\" decoding=\"async\" referrerPolicy=\"no-referrer\" onError={(event) => event.currentTarget.remove()} />}\n              </div>",
              1)
          replace(u,
              "              {add.isError && <p className=\"mt-2 rounded-xl bg-red-50 p-2 text-center text-xs font-bold text-red-700\">{friendError(add.error)}</p>}\n",
              "",
              1)
          PY

      - name: Commit product changes if needed
        run: |
          if git diff --quiet; then
            echo "Product hotfix already applied."
          else
            git config user.name "sandoval2021"
            git config user.email "78934835+sandoval2021@users.noreply.github.com"
            git add apps/api/src/routes/friends.routes.ts apps/api/src/routes/profile.routes.ts apps/web/src/pages/PublicProfilePage.tsx apps/web/src/pages/competitions/StandingsPage.tsx apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
            git commit -m "fix: speed up competition reads and repair friendship flow"
            git push origin HEAD:hotfix-performance-social
          fi

      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build web
        run: npm run build --workspace=@chavea/web
      - name: Assert hotfix invariants
        run: |
          set -euo pipefail
          grep -Fq 'tx.$executeRaw`SELECT pg_advisory_xact_lock' apps/api/src/routes/friends.routes.ts
          ! grep -Fq 'tx.$queryRaw`SELECT pg_advisory_xact_lock' apps/api/src/routes/friends.routes.ts
          grep -Fq 'FRIEND_REQUEST_FAILED' apps/api/src/routes/friends.routes.ts
          grep -Fq 'Convite enviado!' apps/web/src/pages/PublicProfilePage.tsx
          grep -Fq 'onError={(event) => event.currentTarget.remove()}' apps/web/src/pages/PublicProfilePage.tsx
          grep -Fq 'refetchInterval: 12_000' apps/web/src/pages/competitions/StandingsPage.tsx
          grep -Fq "activeTab === 'rounds'" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          ! grep -Fq 'refetchInterval: 3_000' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
