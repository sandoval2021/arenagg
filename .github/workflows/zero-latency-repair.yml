name: Zero Latency JSX Repair

on:
  push:
    branches: [hotfix-zero-latency]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair Album image arrow expression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/AlbumPage.tsx')
          text = path.read_text()
          broken = 'onError={() = loading="lazy" decoding="async" > setFailed(true)}'
          fixed = 'onError={() => setFailed(true)} loading="lazy" decoding="async"'
          if broken in text:
              path.write_text(text.replace(broken, fixed))
          PY
          git diff --check
      - name: Commit repair when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name sandoval2021
          git config user.email '78934835+sandoval2021@users.noreply.github.com'
          git add apps/web/src/pages/AlbumPage.tsx
          git commit -m 'fix(images): repair album async image attributes'
          git push origin HEAD:hotfix-zero-latency
