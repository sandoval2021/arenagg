name: Competition Dashboard Performance CI

on:
  push:
    branches: [perf-competition-dashboard-zero-latency]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply product patch when needed
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq 'perf: make competition dashboard zero-latency'; then
            echo 'Product patch already committed.'
          else
            python scripts/apply_competition_dashboard_perf.py
            git config user.name 'sandoval2021'
            git config user.email '78934835+sandoval2021@users.noreply.github.com'
            git add apps/api/src/routes/competitions.routes.ts \
                    apps/web/src/lib/api.ts \
                    apps/web/src/lib/phase-three-api.ts \
                    apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx \
                    apps/web/src/pages/competitions/StandingsPage.tsx \
                    apps/web/src/components/competition/CompetitionCard.tsx \
                    apps/web/src/components/competition/CompetitionPhaseFiveCenter.tsx \
                    apps/web/src/components/competition/CompetitionPrizePanel.tsx \
                    apps/web/src/components/matches/CompetitionMatchAutomationPanel.tsx
            git commit -m 'perf: make competition dashboard zero-latency'
            git push origin HEAD:perf-competition-dashboard-zero-latency
          fi
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert competition payload contract
        run: |
          set -euo pipefail
          grep -Fq "competitions.get('/:id/matches'" apps/api/src/routes/competitions.routes.ts
          grep -Fq "matches: []" apps/api/src/routes/competitions.routes.ts
          grep -Fq "take: 41" apps/api/src/routes/competitions.routes.ts
          grep -Fq "Promise.all([" apps/api/src/routes/competitions.routes.ts
          grep -Fq "?view=operations" apps/web/src/lib/phase-three-api.ts
      - name: Assert frontend zero-waterfall contract
        run: |
          set -euo pipefail
          grep -Fq "activeTab === 'standings'" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq "refetchInterval: 3_000" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq "competition-matches" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq "RoundSkeleton" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq "onPointerDown={prefetch}" apps/web/src/components/competition/CompetitionCard.tsx
      - name: Assert deferred rendering contract
        run: |
          set -euo pipefail
          grep -Fq "lazy(() =>" apps/web/src/pages/competitions/CompetitionDetailExperience.tsx
          grep -Fq "IntersectionObserver" apps/web/src/pages/competitions/CompetitionDetailExperience.tsx
          grep -Fq "contentVisibility: 'auto'" apps/web/src/pages/competitions/CompetitionDetailExperience.tsx
