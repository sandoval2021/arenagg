name: Polling Auth Stability CI

on:
  push:
    branches: [hotfix-polling-auth-stability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply deterministic product patch
        run: node scripts/apply-polling-auth-stability.mjs
      - name: Commit patched product files
        run: |
          set -euo pipefail
          git diff --check
          if ! git diff --quiet; then
            git config user.name "sandoval2021"
            git config user.email "78934835+sandoval2021@users.noreply.github.com"
            git add apps/web/src/lib/api.ts apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
            git commit -m "fix(competition): keep active cup mounted through auth polling"
            git push origin HEAD:hotfix-polling-auth-stability
          fi
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert centralized Bearer barrier
        run: |
          set -euo pipefail
          grep -Fq 'getSupabaseAccessTokenForRequest' apps/web/src/lib/api.ts
          grep -Fq "AUTH_RESTORING" apps/web/src/lib/api.ts
          grep -Fq 'if (refreshInFlight)' apps/web/src/lib/supabase-auth.ts
          grep -Fq 'hydrationInFlight' apps/web/src/lib/supabase-auth.ts
      - name: Assert competition never panics on transient polling error
        run: |
          set -euo pipefail
          grep -Fq 'firstLoadNotFound' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'data === undefined && isRealNotFound' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'standings.data !== undefined && <StandingsTable' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'roundMatches.data !== undefined && <RoundsView' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'standings.data !== undefined && <StandingsTable' apps/web/src/pages/competitions/StandingsPage.tsx
          if grep -Fq 'onPointerDown={prefetch}' apps/web/src/components/competition/CompetitionCard.tsx; then
            echo 'Touch prefetch race still present.' >&2
            exit 1
          fi
      - name: Assert auth escape and silent PWA update hooks
        run: |
          set -euo pipefail
          grep -Fq 'AUTH_BOOTSTRAP_TIMEOUT_MS = 5_000' apps/web/src/components/auth/AuthBootstrapEscape.tsx
          grep -Fq '<AuthBootstrapEscape />' apps/web/src/main.tsx
          grep -Fq 'registration.update()' apps/web/src/components/pwa/PwaUpdatePrompt.tsx
          grep -Fq "visibilitychange" apps/web/src/components/pwa/PwaUpdatePrompt.tsx
