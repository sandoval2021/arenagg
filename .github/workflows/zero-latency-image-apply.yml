name: Zero Latency Image Apply

on:
  push:
    branches: [hotfix-zero-latency]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply and verify image performance hints
        run: |
          python .tmp/zero_latency_images.py
          git diff --check
      - name: Commit image optimizations when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name sandoval2021
          git config user.email '78934835+sandoval2021@users.noreply.github.com'
          git add apps/web/src
          git commit -m 'perf(images): add lazy async decode to every image'
          git push origin HEAD:hotfix-zero-latency
