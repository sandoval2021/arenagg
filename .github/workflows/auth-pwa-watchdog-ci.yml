name: Auth PWA Watchdog CI

on:
  push:
    branches: [hotfix-auth-watchdog-pwa-update]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert auth escape contract
        run: |
          set -euo pipefail
          grep -Fq 'AUTH_BOOT_TIMEOUT_MS = 5_000' apps/web/src/hooks/useAuth.tsx
          grep -Fq 'window.setTimeout(() => value.forceLoginRecovery(), AUTH_BOOT_TIMEOUT_MS)' apps/web/src/hooks/useAuth.tsx
          grep -Fq "window.location.replace('/login')" apps/web/src/hooks/useAuth.tsx
          grep -Fq 'suspendSupabasePersistence();' apps/web/src/hooks/useAuth.tsx
          grep -Fq 'export function getSupabaseAccessToken(): string | null' apps/web/src/lib/supabase-auth.ts
          grep -Fq 'return cachedAccessToken;' apps/web/src/lib/supabase-auth.ts
      - name: Assert silent PWA update contract
        run: |
          set -euo pipefail
          grep -Fq "registerType: 'autoUpdate'" apps/web/vite.config.ts
          grep -Fq 'clientsClaim: true' apps/web/vite.config.ts
          grep -Fq 'skipWaiting: true' apps/web/vite.config.ts
          grep -Fq "updateViaCache: 'none'" apps/web/src/main.tsx
          grep -Fq 'await registration.update();' apps/web/src/main.tsx
          grep -Fq "window.addEventListener('online', checkForUpdate)" apps/web/src/main.tsx
          grep -Fq "navigator.serviceWorker.addEventListener('controllerchange'" apps/web/src/main.tsx
          grep -Fq 'v8-20260910-auth-watchdog' apps/web/src/sw.js
          grep -Fq 'await self.skipWaiting()' apps/web/src/sw.js
          grep -Fq 'await self.clients.claim()' apps/web/src/sw.js
