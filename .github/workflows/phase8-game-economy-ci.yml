name: Phase 8 Game Economy CI

on:
  push:
    branches: [phase8-game-economy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build web
        env:
          VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
        run: npm run build --workspace=@chavea/web
      - name: Assert reward invariants
        run: |
          grep -F 'lastLoginReward      DateTime?' prisma/schema.prisma
          grep -F "creditStickerPacks(tx, userId, 'COMMON', inserted.count)" apps/api/src/services/achievement-engine.service.ts
          grep -F "creditStickerPacks(tx, champion.participation.userId, 'PREMIUM', 3)" apps/api/src/services/profile-stats.service.ts
          grep -F 'Você ganhou 1 Pacote Diário de Cartas!' apps/web/src/hooks/useAuth.tsx
          grep -F "America/Sao_Paulo" apps/api/src/services/sticker-pack-rewards.service.ts
          ! grep -F '$queryRaw`SELECT pg_advisory_xact_lock' apps/api/src/services/profile-stats.service.ts
          grep -F '$executeRaw`SELECT pg_advisory_xact_lock' apps/api/src/services/profile-stats.service.ts
