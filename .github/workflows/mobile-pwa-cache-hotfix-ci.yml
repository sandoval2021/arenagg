name: Mobile PWA Cache Hotfix CI

on:
  push:
    branches: [hotfix-pwa-cache-cookie-mobile]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert mobile PWA update contract
        run: |
          set -euo pipefail
          grep -Fq "registerType: 'autoUpdate'" apps/web/vite.config.ts
          grep -Fq 'await self.skipWaiting()' apps/web/src/sw.js
          grep -Fq 'await self.clients.claim()' apps/web/src/sw.js
          grep -Fq "const CACHE_PREFIX = 'chavea-shell-'" apps/web/src/sw.js
          grep -Fq 'v6-20260910' apps/web/src/sw.js
          grep -Fq '/sw.js' apps/web/public/_headers
          grep -Fq 'Cache-Control: no-cache, no-store, must-revalidate' apps/web/public/_headers
      - name: Assert persistent session cookie contract
        run: |
          set -euo pipefail
          grep -Fq 'HttpOnly; Secure; SameSite=Lax; Max-Age=${SESSION_COOKIE_MAX_AGE_SECONDS}; Path=/' apps/api/src/routes/auth.routes.ts
          grep -Fq 'SESSION_COOKIE_MAX_AGE_SECONDS = 2_592_000' apps/api/src/routes/auth.routes.ts
      - name: Assert mobile standings contract
        run: |
          set -euo pipefail
          grep -Fq 'overflow-x-auto' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq 'min-w-[620px]' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq '<table' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'overflow-x-auto' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'min-w-[520px]' apps/web/src/components/competition/GroupStagePanel.tsx
          for col in PTS J V E D SG; do
            grep -Fq ">$col<" apps/web/src/components/competition/GroupStagePanel.tsx
          done
          if grep -nE 'hidden[^\n]*(PTS|J|V|E|D|SG)|(PTS|J|V|E|D|SG)[^\n]*hidden' apps/web/src/components/standings/StandingsTable.tsx apps/web/src/components/competition/GroupStagePanel.tsx; then
            echo 'A standings column is conditionally hidden on mobile.' >&2
            exit 1
          fi
          CSS_FILE="$(find apps/web/dist/assets -maxdepth 1 -type f -name '*.css' | head -n 1)"
          test -n "$CSS_FILE"
          grep -Fq 'overflow-x:auto' "$CSS_FILE"
