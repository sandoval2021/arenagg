name: Deploy ArenaGG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arenagg-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  database:
    name: Database · Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma schema to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          if [ -d prisma/migrations ] && find prisma/migrations -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo 'Applying committed Prisma migrations.'
            npx prisma migrate deploy --schema prisma/schema.prisma
          else
            echo 'No committed Prisma migrations found. Bootstrapping Supabase from schema.prisma.'
            npx prisma db push --schema prisma/schema.prisma --skip-generate
          fi

  worker:
    name: Worker · ArenaGG Hono API
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck ArenaGG API
        run: npm run typecheck --workspace=@chavea/api

      - name: Configure Supabase runtime secret
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL

      - name: Deploy ArenaGG Hono Worker
        id: deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/arenagg-worker-deploy.log
          API_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/arenagg-worker-deploy.log | tail -n 1)"
          if [ -z "$API_URL" ]; then
            echo "Unable to determine deployed Worker URL" >&2
            exit 1
          fi
          echo "ArenaGG Worker URL: $API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Worker and Supabase connection
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_URL/health"
          echo
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_URL/api/health/db"
          echo

      - name: Smoke test registration and CORS
        working-directory: apps/api
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export TEST_EMAIL="arenagg-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"

          curl --silent --show-error \
            -D /tmp/preflight.headers \
            -o /dev/null \
            -X OPTIONS "$API_URL/api/auth/register" \
            -H 'Origin: https://chavea.pages.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'

          grep -qi '^access-control-allow-origin: https://chavea.pages.dev' /tmp/preflight.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/preflight.headers

          npx wrangler tail --format=json > /tmp/arenagg-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 5

          set +e
          STATUS="$(curl --silent --show-error \
            -D /tmp/register.headers \
            -o /tmp/register.body \
            -w '%{http_code}' \
            -X POST "$API_URL/api/auth/register" \
            -H 'Origin: https://chavea.pages.dev' \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"San\",\"email\":\"$TEST_EMAIL\",\"password\":\"ArenaGG-CI-12345!\"}")"
          CURL_EXIT=$?
          set -e

          sleep 3
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true

          echo "Registration HTTP status: $STATUS"
          cat /tmp/register.body || true
          echo

          if [ "$CURL_EXIT" -ne 0 ] || [ "$STATUS" != '201' ]; then
            echo '--- Worker tail diagnostics ---'
            cat /tmp/arenagg-tail.log || true
            exit 1
          fi

          grep -qi '^access-control-allow-origin: https://chavea.pages.dev' /tmp/register.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/register.headers
          grep -qi '^set-cookie: chavea_session=' /tmp/register.headers

          cd ../..
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          import { PrismaPg } from '@prisma/adapter-pg';

          const adapter = new PrismaPg({ connectionString: process.env.DATABASE_URL });
          const prisma = new PrismaClient({ adapter });
          try {
            await prisma.user.deleteMany({ where: { email: process.env.TEST_EMAIL } });
          } finally {
            await prisma.$disconnect();
          }
          NODE

  pages:
    name: Pages · ArenaGG React PWA
    needs: [database, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Validate frontend API binding
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
        run: |
          set -euo pipefail
          if [[ ! "$VITE_API_URL" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev$ ]]; then
            echo "Invalid or missing VITE_API_URL: $VITE_API_URL" >&2
            exit 1
          fi
          echo "Building ArenaGG frontend against: $VITE_API_URL"

      - name: Build ArenaGG Vite app
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
        run: npm run build

      - name: Deploy ArenaGG to existing Cloudflare Pages project
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=chavea --branch=main

      - name: Verify production domain serves current ArenaGG build
        env:
          EXPECTED_API_URL: ${{ needs.worker.outputs.api_url }}
        run: |
          set -euo pipefail
          sleep 15

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 'https://chavea.pages.dev' -o /tmp/arenagg-index.html; then
              ASSET="$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/arenagg-index.html | head -n 1 || true)"
              if [ -n "$ASSET" ] && curl --fail --silent --show-error --max-time 20 "https://chavea.pages.dev$ASSET" -o /tmp/arenagg-app.js; then
                if grep -Fq 'Entre no ArenaGG e comece sua competição.' /tmp/arenagg-app.js && grep -Fq "$EXPECTED_API_URL" /tmp/arenagg-app.js; then
                  echo "Production domain is serving the current ArenaGG build with the correct API URL."
                  exit 0
                fi
              fi
            fi
            echo "Production alias is not current yet (attempt $attempt/6). Waiting..."
            sleep 10
          done

          echo 'chavea.pages.dev is not serving the build produced by this workflow.' >&2
          echo 'This usually means a competing Cloudflare Pages automatic Git deployment is overwriting the direct-upload production deployment.' >&2
          exit 1
