name: Deploy ArenaGG

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arenagg-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  SUPABASE_URL: 'https://uruwrztfbjbykgxwtgvg.supabase.co'

jobs:
  database:
    name: Database · Supabase schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply Prisma schema to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          if [ -d prisma/migrations ] && find prisma/migrations -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo 'Applying committed Prisma migrations.'
            npx prisma migrate deploy --schema prisma/schema.prisma
          else
            echo 'No committed Prisma migrations found. Bootstrapping Supabase from schema.prisma.'
            npx prisma db push --schema prisma/schema.prisma --skip-generate
          fi

  worker:
    name: Worker · ArenaGG Hono API
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck ArenaGG API
        run: npm run typecheck --workspace=@chavea/api

      - name: Configure database and Supabase Auth secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo 'DATABASE_URL_DIRECT is not configured.' >&2
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is required for Worker-side JWT validation and identity mapping.' >&2
            exit 1
          fi
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Configure optional dev password reset secret
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_PASSWORD_RESET_TOKEN: ${{ secrets.DEV_PASSWORD_RESET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DEV_PASSWORD_RESET_TOKEN" ]; then
            printf '%s' "$DEV_PASSWORD_RESET_TOKEN" | npx wrangler secret put DEV_PASSWORD_RESET_TOKEN
            echo 'Temporary password recovery secret synchronized.'
          else
            echo 'DEV_PASSWORD_RESET_TOKEN not configured; temporary recovery remains fail-closed.'
          fi

      - name: Ensure persistent Web Push VAPID secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          EXISTING="$(npx wrangler secret list --format json)"
          if printf '%s' "$EXISTING" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);const names=new Set(rows.map(x=>x.name));process.exit(names.has('VAPID_SERVER_PUBLIC_KEY')&&names.has('VAPID_SERVER_PRIVATE_KEY')?0:1)})"; then
            echo 'Persistent VAPID key pair already configured in Cloudflare Worker secrets.'
          else
            KEYS="$(node ../../scripts/generate-vapid-keys.mjs)"
            PUBLIC_KEY="$(printf '%s' "$KEYS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).publicKey))")"
            PRIVATE_KEY="$(printf '%s' "$KEYS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).privateKey))")"
            printf '%s' "$PUBLIC_KEY" | npx wrangler secret put VAPID_SERVER_PUBLIC_KEY
            printf '%s' "$PRIVATE_KEY" | npx wrangler secret put VAPID_SERVER_PRIVATE_KEY
            unset KEYS PUBLIC_KEY PRIVATE_KEY
            echo 'New VAPID key pair generated once and stored only as encrypted Worker secrets.'
          fi

      - name: Deploy ArenaGG Hono Worker
        id: deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/arenagg-worker-deploy.log
          API_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/arenagg-worker-deploy.log | tail -n 1)"
          if [ -z "$API_URL" ]; then
            echo 'Unable to determine deployed Worker URL' >&2
            exit 1
          fi
          echo "ArenaGG Worker URL: $API_URL"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Worker and Supabase connection
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          set -euo pipefail
          sleep 8
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_URL/health"
          echo
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_URL/api/health/db"
          echo

      - name: Smoke test Bearer auth and CORS
        working-directory: apps/api
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          export TEST_EMAIL="arenagg-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"

          curl --silent --show-error \
            -D /tmp/preflight.headers \
            -o /dev/null \
            -X OPTIONS "$API_URL/api/competitions" \
            -H 'Origin: https://chavea.pages.dev' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization,content-type'

          grep -qi '^access-control-allow-origin: https://chavea.pages.dev' /tmp/preflight.headers
          grep -qi 'access-control-allow-headers:.*Authorization' /tmp/preflight.headers

          STATUS="$(curl --silent --show-error \
            -D /tmp/register.headers \
            -o /tmp/register.body \
            -w '%{http_code}' \
            -X POST "$API_URL/api/auth/register" \
            -H 'Origin: https://chavea.pages.dev' \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"ArenaGG CI\",\"email\":\"$TEST_EMAIL\",\"password\":\"ArenaGG-CI-12345!\"}")"

          echo "Registration HTTP status: $STATUS"
          cat /tmp/register.body
          echo
          test "$STATUS" = '201'
          ACCESS_TOKEN="$(node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/register.body','utf8'));if(!b.session?.accessToken)process.exit(1);process.stdout.write(b.session.accessToken)")"
          test -n "$ACCESS_TOKEN"

          ME_STATUS="$(curl --silent --show-error \
            -o /tmp/me.body \
            -w '%{http_code}' \
            "$API_URL/api/auth/me" \
            -H 'Origin: https://chavea.pages.dev' \
            -H "Authorization: Bearer $ACCESS_TOKEN")"
          cat /tmp/me.body
          echo
          test "$ME_STATUS" = '200'

          COMP_STATUS="$(curl --silent --show-error \
            -o /tmp/competitions.body \
            -w '%{http_code}' \
            "$API_URL/api/competitions" \
            -H 'Origin: https://chavea.pages.dev' \
            -H "Authorization: Bearer $ACCESS_TOKEN")"
          cat /tmp/competitions.body
          echo
          test "$COMP_STATUS" = '200'

          cd ../..
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          import { PrismaPg } from '@prisma/adapter-pg';
          import { createClient } from '@supabase/supabase-js';

          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const { data } = await supabase.auth.admin.listUsers({ page: 1, perPage: 1000 });
          const authUser = data.users.find((row) => row.email?.toLowerCase() === process.env.TEST_EMAIL.toLowerCase());
          if (authUser) await supabase.auth.admin.deleteUser(authUser.id);

          const adapter = new PrismaPg({ connectionString: process.env.DATABASE_URL });
          const prisma = new PrismaClient({ adapter });
          try {
            await prisma.user.deleteMany({ where: { email: process.env.TEST_EMAIL } });
          } finally {
            await prisma.$disconnect();
          }
          NODE

  pages:
    name: Pages · ArenaGG React PWA
    needs: [database, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install workspace dependencies
        run: npm install

      - name: Validate frontend API and Supabase binding
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$VITE_API_URL" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev$ ]]; then
            echo "Invalid or missing VITE_API_URL: $VITE_API_URL" >&2
            exit 1
          fi
          if [[ ! "$VITE_SUPABASE_URL" =~ ^https://[A-Za-z0-9-]+\.supabase\.co$ ]]; then
            echo 'Invalid or missing VITE_SUPABASE_URL.' >&2
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo 'SUPABASE_ANON_KEY GitHub secret is required for browser authentication.' >&2
            exit 1
          fi
          echo "Building ArenaGG frontend against Worker $VITE_API_URL and Supabase $VITE_SUPABASE_URL"

      - name: Build ArenaGG Vite app
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ needs.worker.outputs.api_url }}
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy ArenaGG to existing Cloudflare Pages project
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=chavea --branch=main

      - name: Verify production domain serves current ArenaGG build
        env:
          EXPECTED_API_URL: ${{ needs.worker.outputs.api_url }}
          EXPECTED_SUPABASE_URL: ${{ env.SUPABASE_URL }}
        run: |
          set -euo pipefail
          sleep 15

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 'https://chavea.pages.dev' -o /tmp/arenagg-index.html; then
              ASSET="$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/arenagg-index.html | head -n 1 || true)"
              if [ -n "$ASSET" ] && curl --fail --silent --show-error --max-time 20 "https://chavea.pages.dev$ASSET" -o /tmp/arenagg-app.js; then
                if grep -Fq 'O melhor gerenciador de campeonatos de EA FC e e-Sports!' /tmp/arenagg-app.js && \
                  grep -Fq "$EXPECTED_API_URL" /tmp/arenagg-app.js && \
                  grep -Fq "$EXPECTED_SUPABASE_URL" /tmp/arenagg-app.js; then
                  echo 'Production domain is serving the current ArenaGG build with Worker and Supabase bindings.'
                  exit 0
                fi
              fi
            fi
            echo "Production alias is not current yet (attempt $attempt/6). Waiting..."
            sleep 10
          done

          echo 'chavea.pages.dev is not serving the build produced by this workflow.' >&2
          exit 1
