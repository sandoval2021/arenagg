name: Deploy CHAVEA · Cloudflare D1 + R2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chavea-production-d1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_LOCAL_DATABASE_URL: file:./dev.db
      VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate both Prisma clients and typecheck
        run: |
          set -euo pipefail
          npx prisma generate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/d1/schema.prisma
          npm run typecheck --workspace=@chavea/api
      - name: Build CHAVEA PWA
        run: npm run build --workspace=@chavea/web
      - name: Validate D1 database, owner and configuration
        working-directory: apps/api
        run: |
          set -euo pipefail
          npx wrangler d1 execute chavea-staging --remote --json --command "SELECT COUNT(*) AS count FROM User WHERE email='sandovaloliveira284@gmail.com' AND role='ADMIN' AND isActive=1 AND emailVerified IS NOT NULL AND passwordHash IS NOT NULL" > /tmp/chavea-owner-check.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync('/tmp/chavea-owner-check.json','utf8'));
          const data=Array.isArray(result)?result:result.result;
          const count=data?.[0]?.results?.[0]?.count;
          console.log('VERIFIED_CHAVEA_OWNER='+String(count===1));
          if (count!==1) throw Error('Owner D1 record is not ready; refusing deploy');
          NODE
      - name: Publish CHAVEA Hono API with D1 and R2
        working-directory: apps/api
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify live API D1
        run: |
          set -euo pipefail
          API='https://arenagg-api.sandovaloliveira284.workers.dev'
          CODE=000
          for attempt in $(seq 1 30); do
            CODE="$(curl -fsS --max-time 10 -o /tmp/chavea-api-db.json -w '%{http_code}' "$API/api/health/db" || true)"
            if [ "$CODE" = 200 ] && grep -q '"d1"' /tmp/chavea-api-db.json; then break; fi
            sleep 2
          done
          echo "D1_API_DB_HTTP=$CODE"
          test "$CODE" = 200
          CODE="$(curl -sS -o /tmp/chavea-api-orm.json -w '%{http_code}' "$API/api/health/orm")"
          echo "D1_API_PRISMA_HTTP=$CODE"
          test "$CODE" = 200
      - name: Publish CHAVEA PWA to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name=chavea --branch=main
      - name: Verify production first-party D1 session
        run: |
          set -euo pipefail
          BASE='https://chavea.pages.dev'
          CODE=000
          for attempt in $(seq 1 35); do
            CODE="$(curl -sS --max-time 12 -o /tmp/chavea-pages-db.json -w '%{http_code}' "$BASE/api/health/db" || true)"
            if [ "$CODE" = 200 ] && grep -q '"d1"' /tmp/chavea-pages-db.json; then break; fi
            sleep 2
          done
          echo "CHAVEA_PAGES_D1_HTTP=$CODE"
          test "$CODE" = 200
          EMAIL="d1-auto-$(date +%s)@example.invalid"
          CODE="$(curl -sS -o /tmp/chavea-auto-reg.json -D /tmp/chavea-auto-reg.headers -c /tmp/chavea-auto-cookies -w '%{http_code}' "$BASE/api/auth/register" -X POST -H 'Origin: https://chavea.pages.dev' -H 'Content-Type: application/json' --data "{\"name\":\"CHAVEA Deploy Test\",\"email\":\"$EMAIL\",\"password\":\"SmokeStrong2026!!\"}")"
          echo "CHAVEA_PAGES_REGISTER_HTTP=$CODE"
          if [ "$CODE" != 201 ]; then head -c 800 /tmp/chavea-auto-reg.json; exit 1; fi
          grep -iq 'httponly' /tmp/chavea-auto-reg.headers
          CODE="$(curl -sS -o /tmp/chavea-auto-me.json -b /tmp/chavea-auto-cookies -w '%{http_code}' "$BASE/api/auth/me")"
          echo "CHAVEA_PAGES_SESSION_HTTP=$CODE"
          test "$CODE" = 200
          curl -fsSL "$BASE/login" -o /tmp/chavea-index.html
          grep -q '/assets/' /tmp/chavea-index.html
          USER_ID="$(node -e 'const b=require("/tmp/chavea-auto-reg.json");if(!b.user?.id)process.exit(1);process.stdout.write(b.user.id)')"
          for ENDPOINT in /api/profile/me "/api/profile/$USER_ID"; do
            PROFILE_CODE="$(curl -sS --max-time 15 -b /tmp/chavea-auto-cookies -o /tmp/chavea-profile-check.json -w '%{http_code}' "$BASE$ENDPOINT")"
            echo "D1_PROFILE_ROUTE $ENDPOINT HTTP=$PROFILE_CODE"
            if [ "$PROFILE_CODE" != '200' ]; then
              node -e 'const b=require("/tmp/chavea-profile-check.json");console.log("PROFILE_ERROR_CODE="+(b.error||"unknown"))' || true
              exit 1
            fi
          done
          (
            cd apps/api
            npx wrangler d1 execute chavea-staging --remote --json --command "SELECT id FROM User WHERE email='sandovaloliveira284@gmail.com' AND role='ADMIN' LIMIT 1" > /tmp/chavea-owner-id.json
          )
          OWNER_ID="$(node -e 'const x=require("/tmp/chavea-owner-id.json");const a=Array.isArray(x)?x:x.result;const id=a?.[0]?.results?.[0]?.id;if(!id)process.exit(1);process.stdout.write(id)')"
          OWNER_PROFILE_CODE="$(curl -sS --max-time 15 -b /tmp/chavea-auto-cookies -o /tmp/chavea-owner-public-profile.json -w '%{http_code}' "$BASE/api/profile/$OWNER_ID")"
          echo "D1_OWNER_PUBLIC_PROFILE_HTTP=$OWNER_PROFILE_CODE"
          if [ "$OWNER_PROFILE_CODE" != 200 ]; then
            node -e 'const b=require("/tmp/chavea-owner-public-profile.json");console.log("OWNER_PUBLIC_PROFILE_ERROR="+(b.error||"unknown"))' || true
            exit 1
          fi
          echo 'CHAVEA_D1_PRODUCTION_READY=true'
      - name: Cleanup temporary cookies
        if: always()
        run: rm -f /tmp/chavea-auto-cookies /tmp/chavea-auto-reg.json /tmp/chavea-auto-me.json
