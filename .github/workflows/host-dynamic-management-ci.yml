name: Host Dynamic Management CI

on:
  push:
    branches: [feature-host-dynamic-management-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply deterministic product patches
        run: python3 scripts/apply-host-dynamic-patches.py
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert host-management safety contract
        run: |
          set -euo pipefail
          grep -Fq "status: 'CANCELED'" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "type: 'KNOCKOUT'" apps/api/src/routes/host-actions.routes.ts
          grep -Fq 'generateRoundRobin(teams.map((team) => team.id), false)' apps/api/src/routes/host-actions.routes.ts
          grep -Fq "stage: { type: 'LEAGUE' as const }" apps/api/src/routes/competitions.routes.ts
          grep -Fq "hasKnockoutStage" apps/api/src/routes/competitions.routes.ts
          grep -Fq "label=\"Mata-Mata\"" apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq "CompetitionHostActionsPanel" apps/web/src/pages/competitions/CompetitionDetailExperience.tsx
          grep -Fq "refetchInterval: 3_000" apps/web/src/components/bracket/CompetitionPlayoffTab.tsx
          if grep -nE 'match\.(delete|deleteMany)\(' apps/api/src/routes/host-actions.routes.ts; then
            echo 'Host actions must never delete Match records.' >&2
            exit 1
          fi
          if grep -RFn 'PTS, J, V, E, D e SG ficam sempre disponíveis. Arraste horizontalmente se necessário.' apps/web/src; then
            echo 'Residual standings instruction still exists.' >&2
            exit 1
          fi
          if grep -nF "competition.type === 'LEAGUE' || !match.nextMatchId" apps/api/src/routes/{match-score.routes.ts,match-approval.routes.ts,matches.routes.ts,phase-three-match.routes.ts}; then
            echo 'Modular playoff progression is still blocked by original competition type.' >&2
            exit 1
          fi
      - name: Commit validated product changes
        run: |
          set -euo pipefail
          git config user.name 'sandoval2021'
          git config user.email '78934835+sandoval2021@users.noreply.github.com'
          git add apps/api/src/routes apps/api/src/services apps/web/src
          if git diff --cached --quiet; then
            echo 'No generated product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: complete dynamic host competition management'
          git push origin HEAD:feature-host-dynamic-management-v2
