name: Phase 8 Game Economy Lock Patch

on:
  push:
    branches: [phase8-game-economy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix(economy): harden reward advisory locks')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase8-game-economy
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply lock hardening
        run: node scripts/patch-phase8-reward-locks.mjs
      - name: Commit patched lock calls
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sandoval2021"
          git config user.email "78934835+sandoval2021@users.noreply.github.com"
          git add apps/api/src/services/profile-stats.service.ts
          git commit -m "fix(economy): harden reward advisory locks"
          git push origin HEAD:phase8-game-economy
