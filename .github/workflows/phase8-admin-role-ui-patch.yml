name: Phase 8 Admin Role UI Patch

on:
  push:
    branches: [phase8-admin-bulk-import]
    paths:
      - scripts/patch-phase8-admin-role-ui.mjs
      - .github/workflows/phase8-admin-role-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase8-admin-bulk-import
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/patch-phase8-admin-role-ui.mjs
      - name: Commit patched UI
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "sandoval2021"
          git config user.email "78934835+sandoval2021@users.noreply.github.com"
          git add apps/web/src/pages/OwnerSettingsPage.tsx apps/web/src/pages/ProfilePage.tsx
          git commit -m "feat(admin): show settings to admin role"
          git push origin HEAD:phase8-admin-bulk-import
