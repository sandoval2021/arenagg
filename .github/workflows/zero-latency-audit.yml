name: Zero Latency Audit

on:
  push:
    branches: [hotfix-zero-latency]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit image tags and eager router imports
        run: |
          echo '--- IMG TAGS ---'
          grep -R -n '<img' apps/web/src --include='*.tsx' || true
          echo '--- EAGER PAGE IMPORTS ---'
          grep -n "from '../pages\|from \"../pages" apps/web/src/app/router.tsx || true
