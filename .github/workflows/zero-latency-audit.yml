name: Zero Latency Audit

on:
  push:
    branches: [hotfix-zero-latency]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert zero-block auth bootstrap
        run: |
          set -euo pipefail
          grep -Fq "const USER_SNAPSHOT_KEY = 'chaveaUserSnapshot'" apps/web/src/hooks/useAuth.tsx
          grep -Fq 'retry: 0' apps/web/src/hooks/useAuth.tsx
          grep -Fq 'Zero-latency bootstrap' apps/web/src/hooks/useAuth.tsx
          ! grep -Fq 'loadSessionWithPwaGrace' apps/web/src/hooks/useAuth.tsx
          ! grep -Fq 'SessionBootScreen' apps/web/src/hooks/useAuth.tsx
          ! grep -Fq 'Validando sua sessão' apps/web/src/hooks/useAuth.tsx
          grep -Fq 'InstantAppShell' apps/web/src/components/auth/ProtectedRoute.tsx
      - name: Assert route code splitting and no startup prefetch burst
        run: |
          set -euo pipefail
          grep -Fq "lazy(() => import('../pages/dashboard/DashboardPage')" apps/web/src/app/router.tsx
          grep -Fq "lazy(() => import('../pages/OwnerSettingsPage')" apps/web/src/app/router.tsx
          grep -Fq '<Suspense' apps/web/src/app/router.tsx
          ! grep -Fq 'prefetchQuery' apps/web/src/components/navigation/BottomNavigation.tsx
          ! grep -Fq 'useEffect' apps/web/src/components/navigation/BottomNavigation.tsx
      - name: Assert every image is lazy and async decoded
        run: |
          set -euo pipefail
          total=$(grep -R '<img' apps/web/src --include='*.tsx' | wc -l)
          lazy=$(grep -R '<img' apps/web/src --include='*.tsx' | grep -c 'loading="lazy"')
          async_decode=$(grep -R '<img' apps/web/src --include='*.tsx' | grep -c 'decoding="async"')
          echo "IMG_TAG_LINES=$total LAZY=$lazy ASYNC=$async_decode"
          test "$total" -gt 0
          test "$total" -eq "$lazy"
          test "$total" -eq "$async_decode"
      - name: Assert aggressive avatar optimization
        run: |
          set -euo pipefail
          grep -Fq 'AVATAR_OPTIMIZE_THRESHOLD = 256 * 1024' apps/web/src/lib/social-api.ts
          grep -Fq 'AVATAR_MAX_DIMENSION = 640' apps/web/src/lib/social-api.ts
          grep -Fq "canvas.toBlob(resolve, 'image/webp', AVATAR_WEBP_QUALITY)" apps/web/src/lib/social-api.ts
      - name: Measure initial JavaScript bundle
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const html = fs.readFileSync('apps/web/dist/index.html', 'utf8');
          const match = html.match(/src="\/assets\/([^"]+\.js)"/);
          if (!match) throw new Error('ENTRY_JS_NOT_FOUND');
          const entry = path.join('apps/web/dist/assets', match[1]);
          const size = fs.statSync(entry).size;
          const chunks = fs.readdirSync('apps/web/dist/assets').filter((name) => name.endsWith('.js'));
          console.log(`ENTRY_JS_BYTES=${size}`);
          console.log(`JS_CHUNKS=${chunks.length}`);
          console.log(chunks.sort().join('\n'));
          if (size > 400_000) throw new Error(`ENTRY_BUNDLE_TOO_LARGE:${size}`);
          if (chunks.length < 8) throw new Error(`ROUTE_SPLITTING_NOT_EFFECTIVE:${chunks.length}`);
          NODE
