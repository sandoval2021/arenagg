name: CHAVEA Live Release Acceptance (invite + evidence)
on:
  workflow_run:
    workflows: ['Deploy CHAVEA · Cloudflare D1 + R2']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: chavea-live-release-acceptance
  cancel-in-progress: false
jobs:
  live:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact public URL with disposable accounts and R2 proof
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          const base='https://chavea.pages.dev';
          const origin='https://chavea.pages.dev';
          const ids=[];
          const idFile='/tmp/chavea-live-acceptance-ids.json';
          const save=()=>fs.writeFileSync(idFile,JSON.stringify(ids),{mode:0o600});
          const token=randomUUID();
          const users=[
            {name:'CHAVEA QA Host',email:'chavea-live-smoke-'+token+'-host@example.invalid',password:'SmokeLogin2026!QA'},
            {name:'CHAVEA QA Guest',email:'chavea-live-smoke-'+token+'-guest@example.invalid',password:'SmokeLogin2026!QA'},
          ];
          async function call(label,path,{user,method='GET',body,form,expect=200,json=true}={}){
            const response=await fetch(base+path,{
              method,
              headers:{Origin:origin,...(user?.cookie?{Cookie:user.cookie}:{}),
                ...(body!==undefined?{'Content-Type':'application/json'}:{})},
              body:form??(body!==undefined?JSON.stringify(body):undefined),
              redirect:'follow',signal:AbortSignal.timeout(20000),
            });
            const cookie=response.headers.get('set-cookie')?.split(';')[0];
            if(cookie&&user)user.cookie=cookie;
            let data=null;
            if(json){data=await response.json().catch(()=>null);}
            else data=await response.text();
            console.log(label+' HTTP '+response.status + (data?.error?' ['+data.error+']':''));
            assert.equal(response.status,expect,label+' returned wrong HTTP code');
            return data;
          }
          try {
            for(const u of users){
              const reg=await call('Public registration: '+u.name,'/api/auth/register',{
                user:u,method:'POST',
                body:{name:u.name,email:u.email,password:u.password},expect:201,
              });
              assert.match(reg.user?.id??'',/^[0-9a-f-]{36}$/i);
              ids.push({id:reg.user.id,email:u.email});save();
              await call('First-party cookie session','/api/auth/me',{user:u});
            }
            const [host,guest]=users;
            const cup=await call('Host creates shareable cup','/api/competitions',{
              user:host,method:'POST',expect:201,
              body:{name:'CHAVEA Release QA '+token,type:'KNOCKOUT',game:'EAFC',
                platform:'PS5',maxParticipants:2,requireValidation:true},
            });
            assert.match(cup.id??'',/^[0-9a-f-]{36}$/i);
            const invite=await call('Guest can open public invite URL','/invite/'+cup.id,{json:false});
            assert.ok(invite.includes('/assets/')||invite.includes('<div id="root"'),'Invite SPA was not served');
            await call('Guest joins shareable cup','/api/competitions/'+cup.id+'/join',{
              user:guest,method:'POST',
            });
            const joined=await call('Guest sees lobby and own enrollment','/api/competitions/'+cup.id,{
              user:guest,
            });
            assert.equal(joined.hasJoined,true);
            await call('Host starts two-player cup','/api/competitions/'+cup.id+'/start',{
              user:host,method:'POST',
            });
            const matches=await call('Generated matches visible','/api/competitions/'+cup.id+'/matches',{user:host});
            const match=matches.items?.find(m=>m.homeTeamId&&m.awayTeamId);
            assert.ok(match?.id&&Number.isInteger(match.version),'Fixture not ready');
            await call('Require score photo','/api/matches/'+match.id+'/score',{
              user:host,method:'POST',expect:400,
              body:{homeScore:2,awayScore:1,version:match.version},
            });
            const form=new FormData();
            form.set('homeScore','2');form.set('awayScore','1');
            form.set('version',String(match.version));form.set('scorers','[]');
            form.set('evidence',new File([Buffer.from(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRmwAAAAASUVORK5CYII=','base64'
            )],'proof.png',{type:'image/png'}));
            const score=await call('Submit proof photo to production R2','/api/matches/'+match.id+'/score',{
              user:host,method:'POST',form,
            });
            assert.equal(score.status,'AWAITING_APPROVAL');
            assert.ok(score.playerAEvidenceUrl,'R2 proof reference missing');
            const approved=await call('Opponent approves score','/api/matches/'+match.id+'/approve',{
              user:guest,method:'POST',body:{version:score.version},
            });
            assert.equal(approved.status,'FINISHED');
            await call('Replay approval blocked','/api/matches/'+match.id+'/approve',{
              user:guest,method:'POST',body:{version:score.version},expect:409,
            });
            await call('Host public profile after match','/api/profile/'+ids[0].id,{user:guest});
            await call('Guest public profile after match','/api/profile/'+ids[1].id,{user:host});
            console.log('CHAVEA_LIVE_INVITE_PHOTO_APPROVAL_PASS=true');
          } finally {save();}
          NODE
      - name: Remove ONLY test accounts and cascaded temporary cups
        if: always()
        working-directory: apps/api
        run: |
          set -euo pipefail
          if [ ! -s /tmp/chavea-live-acceptance-ids.json ]; then
            echo 'No test accounts to remove.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const accounts=JSON.parse(fs.readFileSync('/tmp/chavea-live-acceptance-ids.json','utf8'));
          if(!Array.isArray(accounts)||accounts.length>2) throw Error('Unexpected QA account count');
          const queries=[];
          for(const u of accounts){
            if(!/^[0-9a-f-]{36}$/i.test(u.id) ||
               !/^chavea-live-smoke-[0-9a-f-]{36}-(host|guest)@example\.invalid$/.test(u.email))
              throw Error('Refusing unsafe QA cleanup');
            const id="'"+u.id+"'",email="'"+u.email+"'";
            queries.push('DELETE FROM "User" WHERE "id"='+id+
              ' AND "email"='+email+';');
          }
          fs.writeFileSync('/tmp/chavea-live-cleanup.sql',queries.join('\n')+'\n',{mode:0o600});
          NODE
          npx wrangler d1 execute chavea-staging --remote --file /tmp/chavea-live-cleanup.sql
          echo 'CHAVEA_LIVE_QA_USERS_CLEANED=true'
      - name: Erase test identifiers
        if: always()
        run: rm -f /tmp/chavea-live-acceptance-ids.json /tmp/chavea-live-cleanup.sql
