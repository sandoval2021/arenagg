name: Top4 Knockout Upgrade CI

on:
  push:
    branches: [phase8-top4-knockout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Top4 knockout upgrade
        run: python3 scripts/apply-top4-upgrade.py

      - name: Commit applied product changes
        run: |
          if git diff --quiet; then
            echo "No product patch changes to commit."
          else
            git config user.name "sandoval2021"
            git config user.email "78934835+sandoval2021@users.noreply.github.com"
            git add apps/api/src/routes apps/api/src/services/knockout-progression.service.ts apps/web/src/components apps/web/src/lib/host-actions-api.ts
            git commit -m "feat: enforce Top 4 knockout formats and aggregate progression"
            git push origin HEAD:phase8-top4-knockout
          fi

      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build web
        run: npm run build --workspace=@chavea/web
      - name: Assert Top 4 contract
        run: |
          set -euo pipefail
          grep -Fq "size: z.literal(4).optional()" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "format: z.enum(['SINGLE', 'HOME_AWAY'])" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "return [teamIds[0], teamIds[3], teamIds[1], teamIds[2]]" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "{ leg: 1, homeTeamId: slot.awayTeamId, awayTeamId: slot.homeTeamId }" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "{ leg: 2, homeTeamId: slot.homeTeamId, awayTeamId: slot.awayTeamId }" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "advanceKnockoutMatch" apps/api/src/routes/match-score.routes.ts
          grep -Fq "knockout-series:" apps/api/src/services/knockout-progression.service.ts
          grep -Fq "Qual o formato do Mata-Mata?" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          grep -Fq "Jogo Único" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          grep -Fq "Ida e Volta" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          if grep -Fq "Top 8" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx; then
            echo "Top 8 is still exposed in the mandatory Top 4 host action." >&2
            exit 1
          fi
