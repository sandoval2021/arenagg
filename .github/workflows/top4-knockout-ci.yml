name: Top4 Knockout Upgrade CI

on:
  push:
    branches: [phase8-top4-knockout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Top4 knockout upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              if re.search(pattern, text, flags=re.S) is None:
                  if replacement.strip() in text:
                      return
                  raise SystemExit(f'Expected regex not found in {path}: {pattern}')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Unexpected replacement count {count} in {path}')
              write(path, updated)

          host = 'apps/api/src/routes/host-actions.routes.ts'
          replace_once(
              host,
              "const playoffSchema = z.object({ size: z.union([z.literal(4), z.literal(8)]) });",
              "const playoffSchema = z.object({\n  size: z.literal(4).optional(),\n  format: z.enum(['SINGLE', 'HOME_AWAY']),\n});\ntype KnockoutFormat = z.infer<typeof playoffSchema>['format'];",
          )
          regex_once(
              host,
              r"function seededBracket\(teamIds: readonly string\[\]\): string\[\] \{.*?\n\}",
              "function seededBracket(teamIds: readonly string[]): string[] {\n  if (teamIds.length !== 4) throw new Error('PLAYOFF_SIZE_UNSUPPORTED');\n  // Olympic crossing: 1st x 4th and 2nd x 3rd.\n  return [teamIds[0], teamIds[3], teamIds[1], teamIds[2]];\n}",
          )

          new_create = r'''async function createKnockoutStage(
  tx: Tx,
  competitionId: string,
  teamIds: readonly string[],
  order: number,
  format: KnockoutFormat,
): Promise<{ stageId: string; matchCount: number }> {
  const stage = await tx.stage.create({
    data: {
      competitionId,
      type: 'KNOCKOUT',
      name: format === 'HOME_AWAY'
        ? 'Fase Final · Top 4 · Semis Ida e Volta'
        : 'Fase Final · Top 4 · Jogo Único',
      order,
      status: 'ACTIVE',
    },
  });

  const slots = generateKnockout(teamIds);
  const bracketSize = teamIds.length;
  let cursor = 0;
  let slotsInRound = bracketSize / 2;
  let roundNumber = 1;
  let matchCount = 0;
  const matchIdsByPosition = new Map<number, string[]>();

  while (slotsInRound >= 1) {
    const round = await tx.round.create({
      data: {
        stageId: stage.id,
        number: roundNumber,
        name: knockoutRoundName(bracketSize, roundNumber),
        status: roundNumber === 1 ? 'ACTIVE' : 'PENDING',
      },
    });

    const isSemifinal = bracketSize === 4 && roundNumber === 1;
    for (const slot of slots.slice(cursor, cursor + slotsInRound)) {
      const legs = format === 'HOME_AWAY' && isSemifinal
        ? [
            // Jogo 1: menor seed recebe o melhor colocado (4º x 1º / 3º x 2º).
            { leg: 1, homeTeamId: slot.awayTeamId, awayTeamId: slot.homeTeamId },
            // Jogo 2: melhor colocado decide em casa.
            { leg: 2, homeTeamId: slot.homeTeamId, awayTeamId: slot.awayTeamId },
          ]
        : [{ leg: 1, homeTeamId: slot.homeTeamId, awayTeamId: slot.awayTeamId }];

      const ids: string[] = [];
      for (const leg of legs) {
        const match = await tx.match.create({
          data: {
            competitionId,
            stageId: stage.id,
            roundId: round.id,
            bracketPosition: slot.position,
            homeTeamId: leg.homeTeamId,
            awayTeamId: leg.awayTeamId,
            nextMatchSlot: slot.nextSlot,
            leg: leg.leg,
          },
        });
        ids.push(match.id);
        matchCount += 1;
      }
      matchIdsByPosition.set(slot.position, ids);
    }

    cursor += slotsInRound;
    slotsInRound /= 2;
    roundNumber += 1;
  }

  for (const slot of slots) {
    if (!slot.nextPosition) continue;
    const sourceIds = matchIdsByPosition.get(slot.position) ?? [];
    const nextMatchId = matchIdsByPosition.get(slot.nextPosition)?.[0];
    if (!nextMatchId) throw new Error('KNOCKOUT_NEXT_MATCH_NOT_CONFIGURED');
    for (const matchId of sourceIds) {
      await tx.match.update({ where: { id: matchId }, data: { nextMatchId } });
    }
  }

  return { stageId: stage.id, matchCount };
}'''
          regex_once(
              host,
              r"async function createKnockoutStage\(.*?\n\}\n\nasync function advanceRoundIfTerminal",
              new_create + "\n\nasync function advanceRoundIfTerminal",
          )
          replace_once(
              host,
              "    allowedPlayoffSizes: leagueStage && !knockoutStage\n      ? ([4, 8] as const).filter((size) => teamCount >= size)\n      : [],",
              "    allowedPlayoffSizes: leagueStage && !knockoutStage && teamCount >= 4 ? ([4] as const) : [],",
          )
          replace_once(
              host,
              "  if (!parsed.success) return c.json({ error: 'INVALID_PLAYOFF_SIZE', message: 'Escolha Top 4 ou Top 8.' }, 400);",
              "  if (!parsed.success) return c.json({ error: 'INVALID_PLAYOFF_FORMAT', message: 'A Fase Final usa obrigatoriamente o Top 4. Escolha Jogo Único ou Ida e Volta.' }, 400);",
          )
          replace_once(
              host,
              "  const playoffSize = parsed.data.size;",
              "  const playoffSize = 4 as const;\n  const knockoutFormat = parsed.data.format;",
          )
          replace_once(
              host,
              "    const bracket = await createKnockoutStage(tx, competitionId, seededBracket(qualified), nextOrder);",
              "    const bracket = await createKnockoutStage(tx, competitionId, seededBracket(qualified), nextOrder, knockoutFormat);",
          )
          replace_once(
              host,
              "      playoffSize,\n      canceledPendingMatches: canceled.count,",
              "      playoffSize,\n      format: knockoutFormat,\n      canceledPendingMatches: canceled.count,",
          )
          replace_once(
              host,
              "              bracketPosition: true,\n              homeScore: true,",
              "              bracketPosition: true,\n              leg: true,\n              homeScore: true,",
          )

          # Replace duplicated single-match advancement with the shared aggregate-aware service.
          route_specs = [
              ('apps/api/src/routes/match-score.routes.ts', "import { resolveWinner } from '../domain/bracket/knockout';", "import { advanceKnockoutMatch } from '../services/knockout-progression.service';", r"\ntype AdvanceableMatch = \{.*?\n\};\n", r"\nasync function advance\(tx: Prisma\.TransactionClient, match: AdvanceableMatch\) \{.*?\n\}\n", 'await advance(tx, row);', 'await advanceKnockoutMatch(tx, row);'),
              ('apps/api/src/routes/match-approval.routes.ts', "import { resolveWinner } from '../domain/bracket/knockout';", "import { advanceKnockoutMatch } from '../services/knockout-progression.service';", None, r"\nasync function advance\(tx: Prisma\.TransactionClient, match: \{.*?\n\}\n", 'await advance(tx, row);', 'await advanceKnockoutMatch(tx, row);'),
              ('apps/api/src/routes/phase-three-match.routes.ts', "import { resolveWinner } from '../domain/bracket/knockout';", "import { advanceKnockoutMatch } from '../services/knockout-progression.service';", r"\ntype AdvanceableMatch = \{.*?\n\};\n", r"\nasync function advance\(tx: Tx, match: AdvanceableMatch\): Promise<void> \{.*?\n\}\n", 'await advance(tx, fresh);', 'await advanceKnockoutMatch(tx, fresh);'),
              ('apps/api/src/routes/match-integrity.routes.ts', "import { resolveWinner } from '../domain/bracket/knockout';", "import { advanceKnockoutMatch } from '../services/knockout-progression.service';", None, r"\nasync function advance\(tx: Tx, match: \{.*?\n\}\n", 'await advance(tx, fresh);', 'await advanceKnockoutMatch(tx, fresh);'),
          ]
          for path, old_import, new_import, type_pattern, fn_pattern, old_call, new_call in route_specs:
              text = read(path)
              if new_import not in text:
                  if old_import not in text:
                      raise SystemExit(f'Advancement import not found in {path}')
                  text = text.replace(old_import, new_import, 1)
              if type_pattern and re.search(type_pattern, text, flags=re.S):
                  text = re.sub(type_pattern, '\n', text, count=1, flags=re.S)
              if re.search(fn_pattern, text, flags=re.S):
                  text = re.sub(fn_pattern, '\n', text, count=1, flags=re.S)
              if old_call in text:
                  text = text.replace(old_call, new_call)
              elif new_call not in text:
                  raise SystemExit(f'Advancement call not found in {path}')
              if path.endswith('match-integrity.routes.ts'):
                  text = text.replace(
                      "await tx.$queryRaw`SELECT pg_advisory_xact_lock(hashtext(${`integrity:${matchId}`}))`;",
                      "await tx.$executeRaw`SELECT pg_advisory_xact_lock(hashtext(${`integrity:${matchId}`}))`;",
                  )
              write(path, text)

          api = 'apps/web/src/lib/host-actions-api.ts'
          text = read(api)
          if "export type KnockoutFormat = 'SINGLE' | 'HOME_AWAY';" not in text:
              text = text.replace("import { apiRequest } from './api';\n", "import { apiRequest } from './api';\n\nexport type KnockoutFormat = 'SINGLE' | 'HOME_AWAY';\n")
          text = text.replace('allowedPlayoffSizes: Array<4 | 8>;', 'allowedPlayoffSizes: Array<4>;')
          text = text.replace('  bracketPosition: number | null;\n  homeScore:', '  bracketPosition: number | null;\n  leg: number;\n  homeScore:')
          old_fn = '''export function startHostPlayoffs(competitionId: string, size: 4 | 8) {
  return apiRequest<{
    generated: true;
    playoffSize: 4 | 8;
    canceledPendingMatches: number;
    qualifiedTeamIds: string[];
    stageId: string;
    bracketMatchCount: number;
  }>(`/api/competitions/${encodeURIComponent(competitionId)}/host-actions/playoffs`, {
    method: 'POST',
    body: JSON.stringify({ size }),
  });
}'''
          new_fn = '''export function startHostPlayoffs(competitionId: string, format: KnockoutFormat) {
  return apiRequest<{
    generated: true;
    playoffSize: 4;
    format: KnockoutFormat;
    canceledPendingMatches: number;
    qualifiedTeamIds: string[];
    stageId: string;
    bracketMatchCount: number;
  }>(`/api/competitions/${encodeURIComponent(competitionId)}/host-actions/playoffs`, {
    method: 'POST',
    body: JSON.stringify({ size: 4, format }),
  });
}'''
          if new_fn not in text:
              if old_fn not in text:
                  raise SystemExit('startHostPlayoffs legacy function not found')
              text = text.replace(old_fn, new_fn, 1)
          write(api, text)

          panel = 'apps/web/src/components/competition/CompetitionHostActionsPanel.tsx'
          text = read(panel)
          text = text.replace(
              "  startHostPlayoffs,\n} from '../../lib/host-actions-api';",
              "  startHostPlayoffs,\n  type KnockoutFormat,\n} from '../../lib/host-actions-api';",
          )
          if "const [playoffModalOpen, setPlayoffModalOpen] = useState(false);" not in text:
              text = text.replace(
                  "  const [success, setSuccess] = useState<string | null>(null);",
                  "  const [success, setSuccess] = useState<string | null>(null);\n  const [playoffModalOpen, setPlayoffModalOpen] = useState(false);",
                  1,
              )
          text = text.replace(
              "    mutationFn: (size: 4 | 8) => startHostPlayoffs(competitionId, size),",
              "    mutationFn: (format: KnockoutFormat) => startHostPlayoffs(competitionId, format),",
          )
          text = text.replace(
              "      setSuccess(`Fase Final Top ${result.playoffSize} criada com ${result.bracketMatchCount} partidas.`);",
              "      setPlayoffModalOpen(false);\n      setSuccess(`Fase Final Top 4 criada em ${result.format === 'HOME_AWAY' ? 'ida e volta nas semifinais' : 'jogo único'} com ${result.bracketMatchCount} partidas.`);",
          )
          old_card = '''          <ActionCard icon={GitBranch} title="Fase Final" description="Congela a Liga e cria um novo Stage de mata-mata com os melhores colocados.">
            <div className="grid grid-cols-2 gap-2">
              {([4, 8] as const).map((size) => {
                const allowed = actions.data?.allowedPlayoffSizes.includes(size) ?? false;
                return <button key={size} disabled={!allowed || pending} onClick={() => playoffs.mutate(size)} className="min-h-10 rounded-xl bg-[#073B8C] px-3 text-xs font-black text-white shadow-sm disabled:bg-slate-200 disabled:text-slate-400">Top {size}</button>;
              })}
            </div>
            {actions.data?.knockoutStage && <p className="mt-2 text-[10px] font-bold text-emerald-700">Mata-mata já criado: {actions.data.knockoutStage.name}</p>}
          </ActionCard>'''
          new_card = '''          <ActionCard icon={GitBranch} title="Fase Final · Top 4" description="Congela a classificação e cruza obrigatoriamente 1º × 4º e 2º × 3º.">
            <button
              type="button"
              disabled={!(actions.data?.allowedPlayoffSizes.includes(4) ?? false) || pending}
              onClick={() => setPlayoffModalOpen(true)}
              className="min-h-10 w-full rounded-xl bg-[#073B8C] px-3 text-xs font-black text-white shadow-sm disabled:bg-slate-200 disabled:text-slate-400"
            >
              Iniciar Fase Final
            </button>
            {actions.data?.knockoutStage && <p className="mt-2 text-[10px] font-bold text-emerald-700">Mata-mata já criado: {actions.data.knockoutStage.name}</p>}
          </ActionCard>'''
          if new_card not in text:
              if old_card not in text:
                  raise SystemExit('Fase Final card not found')
              text = text.replace(old_card, new_card, 1)
          modal = '''
      {playoffModalOpen && (
        <PlayoffFormatModal
          pending={playoffs.isPending}
          onClose={() => !playoffs.isPending && setPlayoffModalOpen(false)}
          onSelect={(format) => playoffs.mutate(format)}
        />
      )}
'''
          marker = '    </section>\n  );\n}\n\nfunction ActionCard'
          if modal.strip() not in text:
              if marker not in text:
                  raise SystemExit('Panel closing marker not found')
              text = text.replace('    </section>\n  );\n}\n\nfunction ActionCard', modal + '    </section>\n  );\n}\n\nfunction ActionCard', 1)
          modal_component = r'''
function PlayoffFormatModal({ pending, onClose, onSelect }: { pending: boolean; onClose: () => void; onSelect: (format: KnockoutFormat) => void }) {
  return (
    <div className="fixed inset-0 z-[140] flex items-end justify-center bg-slate-950/45 p-0 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="playoff-format-title">
      <button type="button" className="absolute inset-0" onClick={onClose} aria-label="Fechar escolha de formato" />
      <section className="relative w-full max-w-md rounded-t-[2rem] border border-slate-200 bg-white p-4 pb-[max(1rem,env(safe-area-inset-bottom))] shadow-2xl sm:rounded-[2rem] sm:p-5">
        <div className="mx-auto mb-3 h-1.5 w-12 rounded-full bg-slate-200 sm:hidden" />
        <p className="text-[10px] font-black uppercase tracking-[.2em] text-[#073B8C]">Top 4 obrigatório</p>
        <h3 id="playoff-format-title" className="mt-1 text-xl font-black text-slate-950">Qual o formato do Mata-Mata?</h3>
        <p className="mt-2 text-xs font-semibold leading-5 text-slate-500">O chaveamento será sempre 1º × 4º e 2º × 3º. A Final permanece em jogo único.</p>
        <div className="mt-4 grid gap-2 sm:grid-cols-2">
          <button type="button" disabled={pending} onClick={() => onSelect('SINGLE')} className="min-h-14 rounded-2xl border border-blue-200 bg-blue-50 px-4 text-sm font-black text-[#073B8C] transition active:scale-[.98] disabled:opacity-50">Jogo Único</button>
          <button type="button" disabled={pending} onClick={() => onSelect('HOME_AWAY')} className="min-h-14 rounded-2xl bg-[#073B8C] px-4 text-sm font-black text-white shadow-md transition active:scale-[.98] disabled:opacity-50">Ida e Volta</button>
        </div>
        <p className="mt-3 rounded-xl bg-slate-50 px-3 py-2 text-[10px] font-bold leading-4 text-slate-500">Ida e Volta: o 4º/3º recebe o Jogo 1, o 1º/2º decide o Jogo 2 em casa. Quem tiver mais gols no agregado avança.</p>
        <button type="button" disabled={pending} onClick={onClose} className="mt-3 min-h-10 w-full rounded-xl border border-slate-200 bg-white text-xs font-black text-slate-500 disabled:opacity-50">Cancelar</button>
      </section>
    </div>
  );
}
'''
          if 'function PlayoffFormatModal(' not in text:
              text += modal_component
          write(panel, text)

          tab = 'apps/web/src/components/bracket/CompetitionPlayoffTab.tsx'
          text = read(tab)
          text = text.replace(
              "                {round.matches.map((match) => <PlayoffMatchCard key={match.id} match={match} />)}",
              "                {round.matches.map((match) => <PlayoffMatchCard key={match.id} match={match} showLeg={round.matches.filter((item) => item.bracketPosition === match.bracketPosition).length > 1} />)}",
          )
          old_card_fn = '''function PlayoffMatchCard({ match }: { match: PlayoffMatch }) {
  return <article className="rounded-xl border border-slate-200 bg-white p-2.5 shadow-sm"><TeamRow name={match.homeTeam?.name ?? 'A definir'} logoUrl={match.homeTeam?.logoUrl} score={match.homeScore} /><div className="my-2 h-px bg-slate-100" /><TeamRow name={match.awayTeam?.name ?? 'A definir'} logoUrl={match.awayTeam?.logoUrl} score={match.awayScore} /><p className="mt-2 border-t border-slate-100 pt-2 text-[9px] font-black uppercase tracking-[.12em] text-slate-400">{statusLabel(match.status)}</p></article>;
}'''
          new_card_fn = '''function PlayoffMatchCard({ match, showLeg }: { match: PlayoffMatch; showLeg: boolean }) {
  return <article className="rounded-xl border border-slate-200 bg-white p-2.5 shadow-sm">{showLeg && <p className="mb-2 text-[9px] font-black uppercase tracking-[.14em] text-[#073B8C]">Jogo {match.leg} · {match.leg === 1 ? 'Ida' : 'Volta'}</p>}<TeamRow name={match.homeTeam?.name ?? 'A definir'} logoUrl={match.homeTeam?.logoUrl} score={match.homeScore} /><div className="my-2 h-px bg-slate-100" /><TeamRow name={match.awayTeam?.name ?? 'A definir'} logoUrl={match.awayTeam?.logoUrl} score={match.awayScore} /><p className="mt-2 border-t border-slate-100 pt-2 text-[9px] font-black uppercase tracking-[.12em] text-slate-400">{statusLabel(match.status)}</p></article>;
}'''
          if new_card_fn not in text:
              if old_card_fn not in text:
                  raise SystemExit('PlayoffMatchCard block not found')
              text = text.replace(old_card_fn, new_card_fn, 1)
          write(tab, text)
          PY

      - name: Commit applied product changes
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
          else
            git config user.name "sandoval2021"
            git config user.email "78934835+sandoval2021@users.noreply.github.com"
            git add apps/api/src/routes apps/api/src/services/knockout-progression.service.ts apps/web/src/components apps/web/src/lib/host-actions-api.ts
            git commit -m "feat: enforce Top 4 knockout formats and aggregate progression"
            git push origin HEAD:phase8-top4-knockout
          fi

      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build web
        run: npm run build --workspace=@chavea/web
      - name: Assert Top 4 contract
        run: |
          set -euo pipefail
          grep -Fq "size: z.literal(4).optional()" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "format: z.enum(['SINGLE', 'HOME_AWAY'])" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "return [teamIds[0], teamIds[3], teamIds[1], teamIds[2]]" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "{ leg: 1, homeTeamId: slot.awayTeamId, awayTeamId: slot.homeTeamId }" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "{ leg: 2, homeTeamId: slot.homeTeamId, awayTeamId: slot.awayTeamId }" apps/api/src/routes/host-actions.routes.ts
          grep -Fq "advanceKnockoutMatch" apps/api/src/routes/match-score.routes.ts
          grep -Fq "knockout-series:" apps/api/src/services/knockout-progression.service.ts
          grep -Fq "Qual o formato do Mata-Mata?" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          grep -Fq "Jogo Único" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          grep -Fq "Ida e Volta" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx
          if grep -Fq "Top 8" apps/web/src/components/competition/CompetitionHostActionsPanel.tsx; then
            echo "Top 8 is still exposed in the mandatory Top 4 host action." >&2
            exit 1
          fi
