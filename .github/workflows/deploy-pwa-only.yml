name: Publish CHAVEA PWA Manually (Cloudflare D1)
# Automatic main deployment is managed by deploy.yml. This workflow is
# manual-only to prevent a second Pages job from racing and overwriting it.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Check D1 API before publishing
        run: |
          curl --fail --silent --show-error --max-time 15 'https://arenagg-api.sandovaloliveira284.workers.dev/api/health/db' | grep -q '"d1"'
      - name: Build and publish PWA
        working-directory: apps/web
        run: |
          npm run build
          npx wrangler pages deploy dist --project-name=chavea --branch=main
