name: Deploy Chavea PWA Only
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-pwa-only.yml'
  workflow_dispatch:
concurrency:
  group: chavea-pwa-only
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pages:
    name: Publish PWA without database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate currently deployed API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 12 'https://arenagg-api.sandovaloliveira284.workers.dev/health' > /dev/null
      - name: Build PWA with unchanged production API
        working-directory: apps/web
        env:
          VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
        run: npm run build
      - name: Publish to existing Pages project
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=chavea --branch=main
      - name: Check production PWA files
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            curl -fsSL --max-time 15 https://chavea.pages.dev -o /tmp/chavea-index.html || true
            curl -fsSL --max-time 15 https://chavea.pages.dev/sw.js -o /tmp/chavea-sw.js || true
            if grep -Fq 'v13-20261008-auto-update' /tmp/chavea-sw.js; then
              echo 'PWA service worker version confirmed.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production service worker check failed.' >&2
          exit 1
