name: Unified Match Actions CI

on:
  push:
    branches: [hotfix-unify-match-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert unified match UX
        run: |
          set -euo pipefail
          test ! -f apps/web/src/components/matches/CompetitionMatchAutomationPanel.tsx
          ! grep -R "CompetitionMatchAutomationPanel" apps/web/src --exclude-dir=node_modules
          ! grep -R "Link do Clipe / Golaço" apps/web/src --exclude-dir=node_modules
          grep -Fq "Estou Pronto" apps/web/src/components/matches/MatchStatsPanelLight.tsx
          grep -Fq "Aplicar W.O." apps/web/src/components/matches/MatchStatsPanelLight.tsx
          grep -Fq "Adicionar Estatísticas" apps/web/src/components/matches/MatchStatsPanelLight.tsx
