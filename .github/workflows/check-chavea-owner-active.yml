name: Check CHAVEA Owner Status (D1 read-only)
on:
  push:
    branches: ['feat/cloudflare-d1-migration']
    paths: ['.github/workflows/check-chavea-owner-active.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated D1 staging config from remote database list
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !/^[a-f0-9]{32}$/i.test(account || '')) throw Error('Missing Cloudflare GitHub secrets');
          const resp = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/d1/database?per_page=100', {
            headers: { Authorization: 'Bearer ' + token }, signal: AbortSignal.timeout(15000),
          });
          const body = await resp.json();
          if (!resp.ok || !body.success) throw Error('D1 read permission failed: ' + resp.status);
          const db = body.result?.find(row => row.name === 'chavea-staging');
          if (!/^[a-f0-9-]{36}$/i.test(db?.uuid || '')) throw Error('Staging D1 not found');
          fs.writeFileSync('apps/api/wrangler.owner-status.generated.toml', [
            'name = "chavea-d1-owner-status"',
            'main = "src/d1/index.ts"',
            'compatibility_date = "2026-09-08"',
            'compatibility_flags = ["nodejs_compat"]',
            '[[d1_databases]]',
            'binding = "DB"',
            'database_name = "chavea-staging"',
            'database_id = "' + db.uuid + '"',
          ].join('\n'), {mode:0o600});
          NODE
      - name: Verify activated owner without revealing credentials
        working-directory: apps/api
        run: |
          set -euo pipefail
          npx wrangler d1 execute chavea-staging --remote --config wrangler.owner-status.generated.toml --json --command "
            SELECT
              COUNT(*) AS owner_records,
              SUM(CASE WHEN role='ADMIN' AND isActive=1 AND emailVerified IS NOT NULL AND passwordHash IS NOT NULL THEN 1 ELSE 0 END) AS activated_admin
            FROM User WHERE email='sandovaloliveira284@gmail.com';
          " > /tmp/chavea-owner-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out = JSON.parse(fs.readFileSync('/tmp/chavea-owner-result.json','utf8'));
          const data = Array.isArray(out) ? out[0] : out;
          const row = data?.results?.[0];
          if (!row) throw Error('Owner SQL query did not return a result');
          console.log('OWNER_RECORD_COUNT=' + row.owner_records);
          console.log('OWNER_ADMIN_ACTIVE_VERIFIED=' + (row.activated_admin === 1));
          if (row.owner_records !== 1 || row.activated_admin !== 1) process.exitCode=1;
          NODE
      - name: Cleanup
        if: always()
        run: rm -f apps/api/wrangler.owner-status.generated.toml /tmp/chavea-owner-result.json
