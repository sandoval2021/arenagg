name: Auth Escape PWA CI
on:
  push:
    branches: [hotfix-auth-escape-sw-entry-20261008]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run typecheck --workspace=@chavea/api
      - run: npm run build --workspace=@chavea/web
      - run: |
          grep -Fq 'AUTH_BOOTSTRAP_TIMEOUT_MS = 5_000' apps/web/src/components/auth/AuthBootstrapEscape.tsx
          grep -Fq 'window.setTimeout' apps/web/src/components/auth/AuthBootstrapEscape.tsx
          grep -Fq "window.addEventListener('online', checkWorker)" apps/web/src/main.tsx
          grep -Fq "registerType: 'autoUpdate'" apps/web/vite.config.ts
          grep -Fq 'await self.skipWaiting()' apps/web/src/sw.js
          grep -Fq 'await self.clients.claim()' apps/web/src/sw.js
