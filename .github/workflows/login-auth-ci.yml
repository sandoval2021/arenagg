name: Login Auth Hotfix CI

on:
  push:
    branches: [fix-login-supabase-session-regression]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npx prisma generate --schema prisma/schema.prisma
      - run: npm run typecheck --workspace=@chavea/api
      - run: npm run build --workspace=@chavea/web
      - name: Guard against repeated Supabase password resets
        run: |
          set -euo pipefail
          grep -Fq "if (passwordMismatch && user.supabaseAuthId === authUser.id)" apps/api/src/services/supabase-auth.service.ts
          grep -Fq "if (!sameIdentifier(data.user, user))" apps/api/src/services/supabase-auth.service.ts
          grep -Fq "Existing-account login HTTP status" .github/workflows/deploy.yml
          if grep -Fq 'cat /tmp/register.body' .github/workflows/deploy.yml; then
            echo "Auth tokens must not be logged" >&2
            exit 1
          fi
