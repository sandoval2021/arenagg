name: Emergency Pages PWA Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-pages-pwa-20261008.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-only:
    name: Build and publish frontend without database migration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install
      - name: Build PWA
        working-directory: apps/web
        env:
          VITE_API_URL: https://arenagg-api.sandovaloliveira284.workers.dev
        run: npm run build
      - name: Confirm this is the new PWA shell
        run: |
          set -euo pipefail
          test -f apps/web/dist/sw.js
          grep -Fq 'v13-20261008-auto-update' apps/web/dist/sw.js
          grep -Fq "registerType: 'autoUpdate'" apps/web/vite.config.ts
          grep -Fq 'AUTH_BOOTSTRAP_TIMEOUT_MS = 5_000' apps/web/src/components/auth/AuthBootstrapEscape.tsx
      - name: Publish to existing Chavea Pages project
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=chavea --branch=main
      - name: Verify production serves exact new bundle and service worker
        run: |
          set -euo pipefail
          EXPECTED_ASSET="$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' apps/web/dist/index.html | head -n 1)"
          test -n "$EXPECTED_ASSET"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://chavea.pages.dev/' -o /tmp/chavea-live.html && \
               grep -Fq "$EXPECTED_ASSET" /tmp/chavea-live.html && \
               curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' 'https://chavea.pages.dev/sw.js' -o /tmp/chavea-live-sw.js && \
               grep -Fq 'v13-20261008-auto-update' /tmp/chavea-live-sw.js; then
              echo 'Frontend, asset hash and SW v13 are confirmed on chavea.pages.dev.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not serve the expected frontend/SW.' >&2
          exit 1
