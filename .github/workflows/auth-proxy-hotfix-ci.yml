name: Auth Proxy Hotfix CI

on:
  push:
    branches: [hotfix-auth-credentials-proxy]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert credential path
        run: |
          set -euo pipefail
          grep -Fq "credentials: 'include'" apps/web/src/lib/api.ts
          grep -Fq "headers.set('cookie', cookie)" 'apps/web/functions/api/[[path]].ts'
          grep -Fq "credentials: true" apps/api/src/index.ts
          grep -Fq "requestOrigin" apps/api/src/index.ts
          grep -Fq "error.status === 401 || error.status === 403" apps/web/src/hooks/useAuth.tsx
