name: Supabase Bearer Realtime Hotfix CI

on:
  push:
    branches: [hotfix-supabase-bearer-realtime-mobile]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply remaining product patches
        run: |
          set -euo pipefail
          python scripts/apply-supabase-bearer-hotfix.py
          # deploy.yml is updated directly through the GitHub connector after CI.
          git restore .github/workflows/deploy.yml

      - name: Generate pinned workspace lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated product state
        run: |
          set -euo pipefail
          git config user.name 'sandoval2021'
          git config user.email '78934835+sandoval2021@users.noreply.github.com'
          git add prisma/schema.prisma apps/api/src/index.ts apps/web/src/lib/api.ts apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx package-lock.json
          if git diff --cached --quiet; then
            echo 'Product patches already committed.'
          else
            git commit -m 'fix(auth): complete Supabase bearer transport and realtime polling'
            git push origin HEAD:hotfix-supabase-bearer-realtime-mobile
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api

      - name: Build PWA
        run: npm run build --workspace=@chavea/web

      - name: Assert Supabase localStorage session contract
        run: |
          set -euo pipefail
          grep -Fq "storage: window.localStorage" apps/web/src/lib/supabase-auth.ts
          grep -Fq 'autoRefreshToken: true' apps/web/src/lib/supabase-auth.ts
          grep -Fq 'persistSession: true' apps/web/src/lib/supabase-auth.ts
          grep -Fq 'detectSessionInUrl: true' apps/web/src/lib/supabase-auth.ts
          grep -Fq 'supabase.auth.getSession()' apps/web/src/hooks/useAuth.tsx
          grep -Fq 'supabase.auth.onAuthStateChange' apps/web/src/hooks/useAuth.tsx

      - name: Assert Bearer API contract
        run: |
          set -euo pipefail
          grep -Fq "c.req.header('Authorization')" apps/api/src/middleware/auth.middleware.ts
          grep -Fq 'resolveBearerUser' apps/api/src/middleware/auth.middleware.ts
          ! grep -Fq "getCookie(c, 'chavea_session')" apps/api/src/middleware/auth.middleware.ts
          grep -Fq "'Authorization'" apps/api/src/index.ts
          grep -Fq 'getSupabaseAccessToken' apps/web/src/lib/api.ts
          grep -Fq 'Authorization' apps/web/src/lib/api.ts
          grep -Fq 'Bearer ${accessToken}' apps/web/src/lib/api.ts
          grep -Fq "credentials: 'omit'" apps/web/src/lib/api.ts
          grep -Fq 'supabaseAuthId' prisma/schema.prisma
          grep -Fq 'supabaseAuthId' prisma/migrations/20260910123000_supabase_bearer_auth/migration.sql

      - name: Assert realtime and mobile standings contract
        run: |
          set -euo pipefail
          grep -Fq 'refetchInterval: 3_000' apps/web/src/pages/competitions/StandingsPage.tsx
          grep -Fq 'refetchInterval: 3_000' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'refetchInterval: 3_000' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'w-full overflow-x-auto pb-2' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq 'max-w-[80px] truncate' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq 'w-full overflow-x-auto pb-2' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'max-w-[80px] truncate' apps/web/src/components/competition/GroupStagePanel.tsx
          for col in PTS J V E D SG; do
            grep -Fq ">$col<" apps/web/src/components/competition/GroupStagePanel.tsx
          done
          if grep -nE 'hidden[^\n]*(PTS|J|V|E|D|SG)|(PTS|J|V|E|D|SG)[^\n]*hidden' apps/web/src/components/standings/StandingsTable.tsx apps/web/src/components/competition/GroupStagePanel.tsx; then
            echo 'A math standings column is hidden on mobile.' >&2
            exit 1
          fi
          grep -Rho 'overflow-x:auto' apps/web/dist/assets/*.css | head -n 1 | grep -Fq 'overflow-x:auto'
