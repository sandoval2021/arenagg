name: Advisory Lock Hotfix CI

on:
  push:
    branches: [hotfix-prisma-advisory-lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api

      - name: Assert advisory lock uses executeRaw
        run: |
          grep -F 'await tx.$executeRaw`SELECT pg_advisory_xact_lock' apps/api/src/routes/competition-start-v2.routes.ts
          if grep -F 'await tx.$queryRaw`SELECT pg_advisory_xact_lock' apps/api/src/routes/competition-start-v2.routes.ts; then
            echo 'Found unsafe queryRaw advisory lock' >&2
            exit 1
          fi
