name: Chavea Cloudflare Access Check (free, read-only)
on:
  push:
    branches: ['feat/cloudflare-d1-migration']
    paths: ['.github/workflows/chavea-cloudflare-access-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe API token and D1 with no changes to resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) {
            console.log('CONFIG_STATUS=MISSING_GITHUB_SECRETS');
            process.exitCode = 1;
          } else {
            async function probe(label, endpoint) {
              try {
                const response = await fetch('https://api.cloudflare.com/client/v4' + endpoint, {
                  headers: { Authorization: 'Bearer ' + token },
                  signal: AbortSignal.timeout(9000),
                });
                const data = await response.json().catch(() => ({}));
                const firstError = Array.isArray(data.errors) ? data.errors[0] : undefined;
                console.log(label + ' HTTP_STATUS=' + response.status);
                if (firstError) {
                  console.log(label + ' ERROR_CODE=' + String(firstError.code ?? 'unknown'));
                }
                if (label === 'TOKEN') {
                  console.log('TOKEN_STATUS=' + (data.result?.status ?? 'unknown'));
                }
                if (label === 'D1' && response.ok && data.success && Array.isArray(data.result)) {
                  const candidates = data.result.filter(d => /chavea|arenagg/i.test(String(d.name || '')));
                  console.log('D1_COUNT=' + data.result.length);
                  for (const db of candidates) {
                    console.log('D1_CANDIDATE_NAME=' + db.name);
                    console.log('D1_CANDIDATE_ID=' + (db.uuid || 'unavailable'));
                  }
                }
                return response.ok && data.success !== false;
              } catch (error) {
                console.log(label + ' NETWORK_ERROR=' + String(error?.name ?? 'unknown'));
                return false;
              }
            }
            const valid = await probe('TOKEN', '/user/tokens/verify');
            const d1 = await probe('D1', '/accounts/' + encodeURIComponent(account) + '/d1/database?per_page=100');
            const workers = await probe('WORKERS', '/accounts/' + encodeURIComponent(account) + '/workers/scripts?per_page=1');
            console.log('NEXT_STEP=' + (d1 ? 'D1_PROVISIONING_POSSIBLE' : (valid ? 'D1_PERMISSION_OR_ACCOUNT_ID_REQUIRED' : 'CLOUDFLARE_TOKEN_INVALID')));
            if (!d1) process.exitCode = 1;
          }
          NODE
