name: Auth PWA Table Avatar Hotfix CI v2

on:
  push:
    branches: [hotfix-auth-pwa-table-avatar]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply recovery hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  raise SystemExit(f'no change produced for {path}')
              p.write_text(new)

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing pattern: {label}')
              return text.replace(old, new, 1)

          # Auth: the timeout/error handler itself redirects; no React effect is required to escape.
          def auth(text):
              old = """    hardClearBrowserAuth();\n    return {\n      user: null,\n      rewards: { dailyPackGranted: false },\n      bootstrapFailed: true,\n    };"""
              new = """    hardClearBrowserAuth();\n    if (window.location.pathname !== '/login') {\n      window.location.replace('/login');\n    }\n    return {\n      user: null,\n      rewards: { dailyPackGranted: false },\n      bootstrapFailed: true,\n    };"""
              return once(text, old, new, 'auth direct redirect')
          edit('apps/web/src/hooks/useAuth.tsx', auth)

          # PWA: re-register every visible/online boot with updateViaCache=none, then update.
          def main(text):
              pattern = re.compile(r"  const getOrCreateRegistration = async \(\) => \{.*?^  \};", re.M | re.S)
              replacement = """  const getOrCreateRegistration = () =>\n    navigator.serviceWorker.register('/sw.js', {\n      scope: '/',\n      // Re-registering the same scope upgrades older installed PWAs to\n      // updateViaCache=none, forcing WebKit to revalidate sw.js on the network.\n      updateViaCache: 'none',\n    });"""
              text2, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('could not replace SW registration helper')
              text2 = once(text2, '  }, 60_000);', '  }, 30_000);', 'PWA update interval')
              return text2
          edit('apps/web/src/main.tsx', main)

          def sw(text):
              text2, count = re.subn(
                  r"const APP_CACHE = `\$\{CACHE_PREFIX\}v[^`]+`;",
                  "const APP_CACHE = `${CACHE_PREFIX}v9-20260910-mobile-recovery`;",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('could not bump SW cache version')
              return text2
          edit('apps/web/src/sw.js', sw)

          # API response types expose user avatar independently from team logo.
          def api_types(text):
              text = once(
                  text,
                  "homeTeam: { id: string; name: string; logoUrl: string | null } | null;\n    awayTeam: { id: string; name: string; logoUrl: string | null } | null;",
                  "homeTeam: { id: string; name: string; logoUrl: string | null; user: { avatarUrl: string | null } } | null;\n    awayTeam: { id: string; name: string; logoUrl: string | null; user: { avatarUrl: string | null } } | null;",
                  'match avatar types',
              )
              return once(
                  text,
                  "  logoUrl?: string;\n  playerName: string;",
                  "  logoUrl?: string;\n  user: { id: string; avatarUrl: string | null } | null;\n  playerName: string;",
                  'standing avatar type',
              )
          edit('apps/web/src/lib/api.ts', api_types)

          def phase_types(text):
              return once(
                  text,
                  """  team: {\n    name: string;\n    logoUrl: string | null;\n    participation: {\n      user: { id: string; name: string; displayName: string | null };\n    };\n  };""",
                  """  user: { id: string; name: string; displayName: string | null; avatarUrl: string | null };\n  team: {\n    name: string;\n    logoUrl: string | null;\n  };""",
                  'group standing avatar type',
              )
          edit('apps/web/src/lib/phase-six-api.ts', phase_types)

          # General standings: fixed ultra-compact table; no horizontal scrolling.
          def standings(text):
              start = '''      <div\n        className="w-full overflow-x-auto pb-2 overscroll-x-contain touch-pan-x [-webkit-overflow-scrolling:touch]"\n        style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}\n        role="region"\n        aria-label="Tabela de classificação com rolagem horizontal"\n        tabIndex={0}\n      >\n        <table className="w-full min-w-[560px] border-collapse text-[10px] text-slate-700 sm:text-xs">'''
              repl = '''      <div className="w-full pb-1">\n        <table className="w-full table-fixed border-collapse text-[10px] text-slate-700 sm:text-xs">'''
              text = once(text, start, repl, 'general standings scroll wrapper')
              text = once(text,
                  '<th className="w-9 px-1.5 py-1.5 text-center sm:sticky sm:left-0 sm:z-20 sm:w-14 sm:bg-slate-50 sm:px-3 sm:py-3">Pos</th>',
                  '<th className="w-6 px-1 py-1 text-center text-[10px] sm:w-12 sm:px-2 sm:py-2">#</th>',
                  'general pos header')
              text = once(text,
                  '<th className="w-[110px] px-1.5 py-1.5 text-left sm:sticky sm:left-14 sm:z-20 sm:min-w-52 sm:bg-slate-50 sm:px-3 sm:py-3">Time</th>',
                  '<th className="w-[92px] px-1 py-1 text-left text-[10px] sm:w-auto sm:px-2 sm:py-2">Time</th>',
                  'general team header')
              text = once(text,
                  "{['PTS', 'J', 'V', 'E', 'D', 'SG'].map((column) => <th key={column} className=\"px-1.5 py-1.5 text-center sm:px-3 sm:py-3\">{column}</th>)}",
                  "{['PTS', 'J', 'V', 'E', 'D', 'SG'].map((column) => <th key={column} className=\"w-7 px-1 py-1 text-center text-[10px] sm:w-10 sm:px-2 sm:py-2\">{column}</th>)}",
                  'general math headers')
              text = once(text, '<TeamLogo name={row.team} logoUrl={row.logoUrl} podium={podium} />', '<TeamLogo name={row.team} logoUrl={row.user?.avatarUrl ?? row.logoUrl} podium={podium} />', 'general avatar preference')
              text = text.replace('max-w-[80px] truncate text-[11px]', 'max-w-[70px] truncate text-[10px]')
              text = text.replace('max-w-[80px] truncate text-[9px]', 'max-w-[70px] truncate text-[8px]')
              text = text.replace('px-1.5 py-1.5 text-center sm:sticky sm:left-0 sm:z-10 sm:bg-white sm:px-3 sm:py-3', 'w-6 px-1 py-1 text-center text-[10px] sm:w-12 sm:px-2 sm:py-2')
              text = text.replace('px-1.5 py-1.5 sm:sticky sm:left-14 sm:z-10 sm:bg-white sm:px-3 sm:py-2', 'w-[92px] px-1 py-1 sm:w-auto sm:px-2 sm:py-2')
              text = text.replace('px-1.5 py-1.5 text-center text-[11px] font-black text-[#073B8C] sm:px-3 sm:py-3 sm:text-base', 'w-7 px-1 py-1 text-center text-[10px] font-black text-[#073B8C] sm:w-10 sm:px-2 sm:py-2 sm:text-sm')
              text = text.replace('px-1.5 py-1.5 text-center font-extrabold text-slate-600 sm:px-3 sm:py-3', 'w-7 px-1 py-1 text-center text-[10px] font-extrabold text-slate-600 sm:w-10 sm:px-2 sm:py-2')
              text = text.replace('px-1.5 py-1.5 text-center font-extrabold text-emerald-700 sm:px-3 sm:py-3', 'w-7 px-1 py-1 text-center text-[10px] font-extrabold text-emerald-700 sm:w-10 sm:px-2 sm:py-2')
              text = text.replace('px-1.5 py-1.5 text-center font-extrabold text-rose-600 sm:px-3 sm:py-3', 'w-7 px-1 py-1 text-center text-[10px] font-extrabold text-rose-600 sm:w-10 sm:px-2 sm:py-2')
              text = text.replace('px-1.5 py-1.5 text-center font-black sm:px-3 sm:py-3', 'w-7 px-1 py-1 text-center text-[10px] font-black sm:w-10 sm:px-2 sm:py-2')
              text = once(text, 'Arraste para o lado no celular para ver PTS, J, V, E, D e SG. Toque no jogador para abrir o perfil público.', 'PTS, J, V, E, D e SG aparecem juntos no celular. Toque no jogador para abrir o perfil público.', 'general drag notice')
              return text
          edit('apps/web/src/components/standings/StandingsTable.tsx', standings)

          # Group stage standings: vertical group cards and fixed compact tables.
          def groups(text):
              text = once(text, 'Shield, Sparkles, Table2', 'Shield, Table2', 'unused Sparkles import')
              text = once(text,
                  '<div className="-mx-4 overflow-x-auto px-4 pb-2 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden sm:-mx-5 sm:px-5">\n              <div className="flex w-max snap-x snap-mandatory gap-3 pr-4">',
                  '<div className="grid gap-3 md:grid-cols-2">',
                  'group carousel')
              text = once(text, 'className="w-[min(92vw,420px)] shrink-0 snap-center overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm"', 'className="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm"', 'group card width')
              start = '''                    <div\n                      className="w-full overflow-x-auto pb-2 overscroll-x-contain touch-pan-x [-webkit-overflow-scrolling:touch]"\n                      style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}\n                      role="region"\n                      aria-label={`${group.name}: classificação com rolagem horizontal`}\n                      tabIndex={0}\n                    >\n                      <table className="w-full min-w-[500px] border-collapse text-[10px] text-slate-700">'''
              repl = '''                    <div className="w-full pb-1">\n                      <table className="w-full table-fixed border-collapse text-[10px] text-slate-700">'''
              text = once(text, start, repl, 'group table scroll wrapper')
              text = once(text, '<th className="w-8 px-1.5 py-1.5 text-center">#</th>', '<th className="w-6 px-1 py-1 text-center text-[10px]">#</th>', 'group pos header')
              text = once(text, '<th className="w-[110px] px-1.5 py-1.5 text-left">Time</th>', '<th className="w-[88px] px-1 py-1 text-left text-[10px]">Time</th>', 'group team header')
              for col in ('PTS','J','V','E','D','SG'):
                  text = once(text, f'<th className="px-1.5 py-1.5 text-center">{col}</th>', f'<th className="w-7 px-1 py-1 text-center text-[10px]">{col}</th>', f'group {col} header')
              text = once(text, 'const qualified = index < 2;\n                            return (', 'const qualified = index < 2;\n                            const playerImage = row.user?.avatarUrl ?? row.team.logoUrl;\n                            return (', 'group image variable')
              text = once(text, '{row.team.logoUrl ? <img src={row.team.logoUrl}', '{playerImage ? <img src={playerImage}', 'group avatar source')
              text = text.replace('max-w-[80px] truncate text-[10px]', 'max-w-[70px] truncate text-[10px]')
              text = text.replace('px-1.5 py-1.5 text-center', 'px-1 py-1 text-center text-[10px]')
              text = text.replace('px-1.5 py-1.5">\n                                  <div', 'px-1 py-1">\n                                  <div')
              # Close only the remaining single grid wrapper and remove drag notice.
              old_tail = '''                ))}\n              </div>\n            </div>\n\n            <div className="mt-3 flex items-center gap-2 rounded-2xl bg-blue-50 px-3 py-2.5 text-[10px] font-bold text-[#073B8C]"><Sparkles className="h-4 w-4 shrink-0" />Arraste a tabela para o lado no celular. PTS, J, V, E, D e SG permanecem sempre disponíveis.</div>'''
              new_tail = '''                ))}\n            </div>'''
              text = once(text, old_tail, new_tail, 'group drag notice/tail')
              return text
          edit('apps/web/src/components/competition/GroupStagePanel.tsx', groups)

          # Backend: send user avatar explicitly instead of hiding it inside logoUrl.
          def competitions(text):
              text = once(text,
                  '''            logoUrl: match.homeTeam.logoUrl\n              ?? match.homeTeam.participation.user.avatarUrl\n              ?? match.homeTeam.participation.teamLogoUrl\n              ?? null,''',
                  '''            logoUrl: match.homeTeam.logoUrl ?? match.homeTeam.participation.teamLogoUrl ?? null,\n            user: { avatarUrl: match.homeTeam.participation.user.avatarUrl },''',
                  'home match avatar payload')
              text = once(text,
                  '''            logoUrl: match.awayTeam.logoUrl\n              ?? match.awayTeam.participation.user.avatarUrl\n              ?? match.awayTeam.participation.teamLogoUrl\n              ?? null,''',
                  '''            logoUrl: match.awayTeam.logoUrl ?? match.awayTeam.participation.teamLogoUrl ?? null,\n            user: { avatarUrl: match.awayTeam.participation.user.avatarUrl },''',
                  'away match avatar payload')
              text = once(text,
                  '''        logoUrl:\n          team?.logoUrl\n          ?? team?.participation.user.avatarUrl\n          ?? team?.participation.teamLogoUrl\n          ?? undefined,\n        playerName:''',
                  '''        logoUrl: team?.logoUrl ?? team?.participation.teamLogoUrl ?? undefined,\n        user: team\n          ? { id: team.participation.user.id, avatarUrl: team.participation.user.avatarUrl }\n          : null,\n        playerName:''',
                  'standing avatar payload')
              return text
          edit('apps/api/src/routes/competitions.routes.ts', competitions)

          def phase_route(text):
              old = '''      standings: group.standings.map((row) => ({\n        ...row,\n        team: {\n          ...row.team,\n          logoUrl: row.team.logoUrl\n            ?? row.team.participation.user.avatarUrl\n            ?? row.team.participation.teamLogoUrl\n            ?? null,\n        },\n      })),'''
              new = '''      standings: group.standings.map((row) => ({\n        ...row,\n        user: row.team.participation.user,\n        team: {\n          name: row.team.name,\n          logoUrl: row.team.logoUrl ?? row.team.participation.teamLogoUrl ?? null,\n        },\n      })),'''
              return once(text, old, new, 'group standing avatar payload')
          edit('apps/api/src/routes/phase-six-competition.routes.ts', phase_route)

          def detail(text):
              return once(text, 'logoUrl={team?.logoUrl ?? undefined} compact', 'logoUrl={team?.user?.avatarUrl ?? team?.logoUrl ?? undefined} compact', 'round avatar preference')
          edit('apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx', detail)
          PY
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Typecheck API
        run: npm run typecheck --workspace=@chavea/api
      - name: Build PWA
        run: npm run build --workspace=@chavea/web
      - name: Assert recovery, update, realtime and mobile contracts
        run: |
          set -euo pipefail
          grep -Fq "AUTH_BOOT_TIMEOUT_MS = 5_000" apps/web/src/hooks/useAuth.tsx
          grep -Fq "window.location.replace('/login')" apps/web/src/hooks/useAuth.tsx
          grep -Fq "registerType: 'autoUpdate'" apps/web/vite.config.ts
          grep -Fq "updateViaCache: 'none'" apps/web/src/main.tsx
          grep -Fq 'registration.update()' apps/web/src/main.tsx
          grep -Fq 'self.skipWaiting()' apps/web/src/sw.js
          grep -Fq 'self.clients.claim()' apps/web/src/sw.js
          grep -Fq 'v9-20260910-mobile-recovery' apps/web/src/sw.js
          grep -Fq 'table-fixed' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq 'table-fixed' apps/web/src/components/competition/GroupStagePanel.tsx
          ! grep -Fq 'overflow-x-auto' apps/web/src/components/standings/StandingsTable.tsx
          ! grep -Fq 'overflow-x-auto' apps/web/src/components/competition/GroupStagePanel.tsx
          ! grep -Fq 'Arraste a tabela' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'row.user?.avatarUrl ?? row.logoUrl' apps/web/src/components/standings/StandingsTable.tsx
          grep -Fq 'row.user?.avatarUrl ?? row.team.logoUrl' apps/web/src/components/competition/GroupStagePanel.tsx
          grep -Fq 'user: { avatarUrl: match.homeTeam.participation.user.avatarUrl }' apps/api/src/routes/competitions.routes.ts
          grep -Fq 'user: row.team.participation.user' apps/api/src/routes/phase-six-competition.routes.ts
          grep -Fq 'refetchInterval: 3_000' apps/web/src/pages/competitions/StandingsPage.tsx
          grep -Fq 'refetchInterval: 3_000' apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          grep -Fq 'refetchInterval: 3_000' apps/web/src/components/competition/GroupStagePanel.tsx
      - name: Commit validated product hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/routes/competitions.routes.ts apps/api/src/routes/phase-six-competition.routes.ts apps/web/src/hooks/useAuth.tsx apps/web/src/main.tsx apps/web/src/sw.js apps/web/src/lib/api.ts apps/web/src/lib/phase-six-api.ts apps/web/src/components/standings/StandingsTable.tsx apps/web/src/components/competition/GroupStagePanel.tsx apps/web/src/pages/competitions/CompetitionDetailPageLight.tsx
          git commit -m 'fix: recover mobile auth pwa standings and avatars [skip ci]'
          git push origin HEAD:hotfix-auth-pwa-table-avatar
