name: Phase 8 Admin Patch

on:
  push:
    branches: [phase8-admin-bulk-import]
    paths:
      - scripts/patch-phase8-admin-existing-files.mjs
      - .github/workflows/phase8-admin-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase8-admin-bulk-import
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/patch-phase8-admin-existing-files.mjs
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "sandoval2021"
          git config user.email "78934835+sandoval2021@users.noreply.github.com"
          git add prisma/schema.prisma apps/api/src/services/auth.service.ts apps/api/src/index.ts apps/web/src/hooks/useAuth.tsx apps/web/src/pages/OwnerSettingsPage.tsx apps/web/src/pages/AlbumPage.tsx
          git commit -m "feat(admin): wire secure card bulk import"
          git push origin HEAD:phase8-admin-bulk-import
