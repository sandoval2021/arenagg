name: Sync Chavea Storage Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-storage-secret:
    name: Cloudflare · Supabase Storage secret
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install

      - name: Validate Storage credential
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is missing from GitHub Actions secrets.' >&2
            exit 1
          fi
          echo 'Supabase Storage credential is configured.'

      - name: Sync Storage credential to Chavea Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Smoke test real shield upload
        working-directory: apps/api
        env:
          SUPABASE_URL: https://uruwrztfbjbykgxwtgvg.supabase.co
          SUPABASE_SHIELDS_BUCKET: escudos
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_URL?.trim();
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          const bucket = process.env.SUPABASE_SHIELDS_BUCKET?.trim() || 'escudos';
          if (!url || !key) throw new Error('Supabase Storage environment is incomplete.');

          const client = createClient(url, key, {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false,
            },
          });

          const path = `ci/smoke-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}.png`;
          const png = Uint8Array.from(
            Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=', 'base64'),
          );
          let uploaded = false;

          try {
            const { error: uploadError } = await client.storage.from(bucket).upload(path, png, {
              contentType: 'image/png',
              cacheControl: '60',
              upsert: true,
            });
            if (uploadError) throw new Error(`Storage upload failed: ${uploadError.message}`);
            uploaded = true;

            const { data } = client.storage.from(bucket).getPublicUrl(path);
            if (!data.publicUrl) throw new Error('Storage did not return a public URL.');

            const response = await fetch(data.publicUrl, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Public shield URL returned HTTP ${response.status}.`);
            const bytes = await response.arrayBuffer();
            if (bytes.byteLength === 0) throw new Error('Public shield URL returned an empty file.');

            console.log(`Supabase Storage upload/public-read verified in bucket '${bucket}'.`);
          } finally {
            if (uploaded) {
              const { error: removeError } = await client.storage.from(bucket).remove([path]);
              if (removeError) throw new Error(`Storage cleanup failed: ${removeError.message}`);
              console.log('Storage smoke-test object removed successfully.');
            }
          }
          NODE
