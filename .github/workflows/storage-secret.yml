name: Sync ArenaGG Storage Secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storage-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-storage-secret:
    name: Cloudflare · Supabase Storage secret
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install workspace dependencies
        run: npm install

      - name: Validate Storage credential
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo 'SUPABASE_SERVICE_ROLE_KEY is missing from GitHub Actions secrets.' >&2
            exit 1
          fi
          echo 'Supabase Storage credential is configured.'

      - name: Sync Storage credential to ArenaGG Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
