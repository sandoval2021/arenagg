name: Phase 8 Game Economy Patch

on:
  push:
    branches: [phase8-game-economy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat(economy): apply game economy patches')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase8-game-economy
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply patches
        run: node scripts/patch-phase8-game-economy.mjs
      - name: Commit patched files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sandoval2021"
          git config user.email "78934835+sandoval2021@users.noreply.github.com"
          git add prisma/schema.prisma apps/api/src/routes/auth.routes.ts apps/api/src/services/achievement-engine.service.ts apps/api/src/services/profile-stats.service.ts apps/web/src/hooks/useAuth.tsx
          git commit -m "feat(economy): apply game economy patches"
          git push origin HEAD:phase8-game-economy
