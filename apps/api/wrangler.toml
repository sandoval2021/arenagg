name = "chavea-api"
main = "src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

# Run `npx wrangler hyperdrive create chavea-postgres --connection-string="..."`
# and replace the placeholder below with the returned Hyperdrive ID.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

# Create with: `npx wrangler r2 bucket create chavea-evidence`
[[r2_buckets]]
binding = "EVIDENCE_BUCKET"
bucket_name = "chavea-evidence"
